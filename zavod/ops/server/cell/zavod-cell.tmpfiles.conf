# ДАТА СОЗДАНИЯ: 2026-11-01 13:47 +02:00  ДАТА ОБНОВЛЕНИЯ: 2026-11-01 13:47 +02:00
# ИСПОЛНИТЕЛЬ: Claude (сессия 026813c0-b682-4a65-a177-a655b49ea34c)
# НАЗНАЧЕНИЕ: папки запросов (И.12): владелец root, группа zkernel, режим 1730 — ядро кладёт пустые файлы,
#   но не видит список и не трогает чужие (бит sticky). Создаются при каждой загрузке.
#   held — разобранные запросы: перенос внутри /run одной операцией для любого вида записи (файл, папка,
#   ссылка); долговременная отметка с причиной пишется в /var/lib/zavod/start-archive или start-rejected.
d /run/zavod       0755 root root    -
d /run/zavod/start 1730 root zkernel -
d /run/zavod/stop  1730 root zkernel -
d /run/zavod/held  0700 root root    -
