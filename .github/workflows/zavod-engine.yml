# ДОКУМЕНТ: .github/workflows/zavod-engine.yml
# ВЕРСИЯ: v0.1
# СТАТУС: CANDIDATE
# ДАТА СОЗДАНИЯ: 2026-10-09 06:45 +03:00
# ДАТА ОБНОВЛЕНИЯ: 2026-10-09 06:45 +03:00
# ИСПОЛНИТЕЛЬ: Claude (сессия fd43469f-418c-4f8b-b94b-32cc0b8d4acf)
# НАЗНАЧЕНИЕ: Завод, этап 4 — E4-3: проверщик графа H1.31 §12, Flowable 8.0.0 на PostgreSQL 16,
#   учебный заказ через Kernel (узлы 1–20, потоки f01–f24). Три независимых прогона.
# ОГРАНИЧЕНИЯ: секретов не использует (учётка движка одноразовая, создаётся заданием и скрыта маской);
#   права только на чтение; платных маршрутов нет. Закрепления — как zavod-kernel.yml (L-E35-01).
name: Zavod Engine

on:
  push:
    branches: [main, 'zavod/**']
    paths: ['zavod/**', 'bem954/H1_31_PACKAGE_R51/**', '.github/workflows/zavod-engine.yml']
  pull_request:
    paths: ['zavod/**', 'bem954/H1_31_PACKAGE_R51/**', '.github/workflows/zavod-engine.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zavod-engine-${{ github.ref }}
  cancel-in-progress: true

env:
  PKG: bem954/H1_31_PACKAGE_R51

jobs:
  engine:
    name: engine E4-3 (run ${{ matrix.run }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    services:
      postgres:
        image: postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      ZAVOD_PG_IMAGE: postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: pinned PostgreSQL client (same image digest as the server)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pgbin"
          for t in psql pg_dump pg_restore createdb; do
            printf '#!/usr/bin/env bash\nexec docker run --rm -i --network host -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$PWD" "$ZAVOD_PG_IMAGE" %s "$@"\n' "$t" > "$RUNNER_TEMP/pgbin/$t"
            chmod +x "$RUNNER_TEMP/pgbin/$t"
          done
          echo "$RUNNER_TEMP/pgbin" >> "$GITHUB_PATH"
          PATH="$RUNNER_TEMP/pgbin:$PATH" psql --version | tee /dev/stderr | grep -q 'PostgreSQL) 16\.'
      - name: workflow pins (L-E35-01)
        run: node zavod/kernel/ci/workflow_pins.mjs .github/workflows/zavod-engine.yml
      - name: One-time engine admin (not a stored secret)
        shell: bash
        run: |
          P=$(openssl rand -hex 24)
          echo "::add-mask::$P"
          {
            echo "ZAVOD_ENGINE_USER=zavod-e43"
            echo "ZAVOD_ENGINE_PASS=$P"
          } >> "$GITHUB_ENV"
      - name: Engine CI (H1.31, graph check, Flowable on PostgreSQL, E4-3 training order)
        shell: bash
        working-directory: zavod/engine
        run: |
          set -o pipefail
          bash ci/engine_ci.sh "$GITHUB_WORKSPACE/$PKG" "$RUNNER_TEMP/engine" | tee "$RUNNER_TEMP/engine_transcript.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: zavod-engine-run-${{ matrix.run }}
          path: |
            ${{ runner.temp }}/engine_transcript.log
            ${{ runner.temp }}/engine/engine_tests.out
            ${{ runner.temp }}/engine/e43/*
            ${{ runner.temp }}/engine/run/engine.log
          if-no-files-found: ignore
