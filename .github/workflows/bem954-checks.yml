# ДОКУМЕНТ: .github/workflows/bem954-checks.yml
# ВЕРСИЯ: v1.3 (v1.3: задание engine-pg-probes — пункты 1–4, 6–9, 12–14 раздела 22 на PostgreSQL; v1.2: редакция задаётся переменной EDITION, сейчас H1.29; v1.1: задание engine-pg)
# СТАТУС: CANDIDATE
# ДАТА СОЗДАНИЯ: 2026-10-06 19:35 +03:00
# ДАТА ОБНОВЛЕНИЯ: 2026-10-07 06:40 +03:00
# ИСПОЛНИТЕЛЬ: Claude (сессии 4401918c-de88-4db7-841e-b418568ae069 и f19e07a7-6edd-48a5-9ede-88086c949326)
# НАЗНАЧЕНИЕ: Официальная проверка пакета BEM-954 (редакция — EDITION) (ответ ChatGPT R48, В2):
#   static — сверщики, самопроверка, 247 подделок, факты раунда;
#   pg16   — установка SQL на одноразовом PostgreSQL 16 и проба D-05.
#   Данные PostgreSQL здесь одноразовые; рабочая база и движок живут на сервере.
# ОГРАНИЧЕНИЯ: секретов не использует; права только на чтение.
name: BEM-954 package checks

on:
  push:
    branches: [main, 'clean/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bem954-${{ github.ref }}
  cancel-in-progress: true

env:
  EDITION: H1.29
  DOC: 101_CLAUDE_ARCHITECT_PROPOSAL_H1_29_R49_v1_29.md
  DOC_SHA256: d50ffc15c63b9fc85947f3484ec7b530dd10f27d0b81c6a68ac834a4e93598ea
  PKG: bem954/H1_29_PACKAGE_R49

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Document SHA-256
        run: echo "$DOC_SHA256  bem954/$DOC" | sha256sum -c -
      - name: verify_package (composition, sums, clean rebuild)
        working-directory: ${{ env.PKG }}
        run: node verify_package.mjs "../$DOC" --expect-edition "$EDITION"
      - name: verify_package selftest (S00-S18)
        working-directory: ${{ env.PKG }}
        run: node verify_package.mjs "../$DOC" --expect-edition "$EDITION" --selftest
      - name: Registry and semantic checkers
        working-directory: ${{ env.PKG }}
        run: |
          node bem954_registry_check.mjs "../$DOC"
          node bem954_semantic_check.mjs "../$DOC"
      - name: Tamper set (247 cases)
        working-directory: ${{ env.PKG }}
        run: node chk_tamper28.mjs "../$DOC" --expect-edition "$EDITION" --report "$RUNNER_TEMP/tamper_report_ci.json" --work "$RUNNER_TEMP/tamper"
      - name: Round facts
        working-directory: ${{ env.PKG }}
        run: node chk_round_facts.mjs "../$DOC" tamper_report.json package_report.json --pg16-evidence EVIDENCE_PG16_D05.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-reports
          path: ${{ runner.temp }}/tamper_report_ci.json
          if-no-files-found: ignore

  pg16:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: psql client
        run: |
          command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          psql --version
      - name: Install SQL twice and run D-05
        shell: bash
        run: bash ci/d05_live.sh "$PKG" "$RUNNER_TEMP/d05" | tee "$RUNNER_TEMP/d05_transcript.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pg16-d05
          path: ${{ runner.temp }}/d05
          if-no-files-found: ignore

  engine-pg:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: psql client
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: One-time engine admin (not a stored secret)
        shell: bash
        run: |
          P=$(openssl rand -hex 24)
          echo "::add-mask::$P"
          {
            echo "ENGINE_USER=ci-admin"
            echo "ENGINE_PASS=$P"
            echo "FLOWABLE_REST_APP_ADMIN_USERID=ci-admin"
            echo "FLOWABLE_REST_APP_ADMIN_PASSWORD=$P"
          } >> "$GITHUB_ENV"
      - name: Flowable on PostgreSQL 16, kill -9 and restart (section 22 item 5)
        shell: bash
        run: bash ci/engine_pg.sh "$RUNNER_TEMP/engine" | tee "$RUNNER_TEMP/engine_transcript.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-pg
          path: |
            ${{ runner.temp }}/engine/run/*.log
            ${{ runner.temp }}/engine/run/*.json
            ${{ runner.temp }}/engine_transcript.log
          if-no-files-found: ignore

  engine-pg-probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: psql client
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: One-time engine admin (not a stored secret)
        shell: bash
        run: |
          P=$(openssl rand -hex 24)
          echo "::add-mask::$P"
          {
            echo "ENGINE_USER=ci-admin"
            echo "ENGINE_PASS=$P"
            echo "FLOWABLE_REST_APP_ADMIN_USERID=ci-admin"
            echo "FLOWABLE_REST_APP_ADMIN_PASSWORD=$P"
          } >> "$GITHUB_ENV"
      - name: Flowable on PostgreSQL 16, section 22 items 1-4, 6-9, 12-14
        shell: bash
        run: |
          set -o pipefail
          bash ci/engine_pg_probes.sh "$RUNNER_TEMP/engine" | tee "$RUNNER_TEMP/engine_transcript.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-pg-probes
          path: |
            ${{ runner.temp }}/engine/run/*.log
            ${{ runner.temp }}/engine/run/*.json
            ${{ runner.temp }}/engine/run/*.jsonl
            ${{ runner.temp }}/engine_transcript.log
          if-no-files-found: ignore
