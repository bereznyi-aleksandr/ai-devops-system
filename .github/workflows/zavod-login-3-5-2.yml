# ДОКУМЕНТ: .github/workflows/zavod-login-3-5-2.yml — испытания программы входов шага 3.5.2 (login_3_5_2.sh)
# ВЕРСИЯ: v0.4  СТАТУС: DRAFT  ДАТА СОЗДАНИЯ: 2026-11-08 20:36 +02:00  ДАТА ОБНОВЛЕНИЯ: 2026-11-08 21:36 +02:00+02:00+02:00
# ИСПОЛНИТЕЛЬ: Claude (сменщик 03, сессия ae87bcd9)
# НАЗНАЧЕНИЕ: shellcheck и 38 испытаний с подставными claude и codex (настоящих ключей нет) на x64 и Arm64.
name: zavod-login-3-5-2
on:
  push:
    paths:
      - zavod/ops/server/login_3_5_2.sh
      - zavod/ops/server/test_login_3_5_2.sh
      - zavod/ops/server/tools_tar_3_5_1b.py
      - .github/workflows/zavod-login-3-5-2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -S warning zavod/ops/server/login_3_5_2.sh zavod/ops/server/test_login_3_5_2.sh
      - name: tests
        run: sudo -E bash zavod/ops/server/test_login_3_5_2.sh zavod/ops/server/login_3_5_2.sh
      - name: sha256
        run: sha256sum zavod/ops/server/login_3_5_2.sh
