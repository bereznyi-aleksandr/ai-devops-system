          a=$(tail -1 "$L1" | sed 's/; { \[ -d "\$P" \].*//' | sed 's/zprobe-b12-install-/zprobe-b12-/')
          b=$(tail -1 "$L" | sed 's/; { \[ -d "\$P" \].*//' | sed 's/zprobe-b12-r2-/zprobe-b12-/')
