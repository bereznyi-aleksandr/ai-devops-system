          for n in curl sha256sum mkdir stat find bash sh env python3 grep cut date dirname id printf tar base64 sed wc sort cmp head; do
            printf '#!/bin/sh\ntouch %s/MARK_%s\nexit 99\n' "$E" "$n" > "$E/bin/$n"; chmod 755 "$E/bin/$n"
          done
          printf 'touch %s/MARK_BASH_ENV\n' "$E" > "$E/benv"
          sudo ls -1A /root | sort > "$T/root3"
          rc=0
          sudo env BASH_ENV="$E/benv" ENV="$E/benv" PATH="$E/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            "BASH_FUNC_curl%%=() { touch $E/MARK_fn_curl; }" "BASH_FUNC_mkdir%%=() { touch $E/MARK_fn_mkdir; }" \
            /bin/dash "$L" > "$T/i3.out" 2>&1 || rc=$?
          cat "$T/i3.out"; echo "rc3=$rc"; test "$rc" = 1
