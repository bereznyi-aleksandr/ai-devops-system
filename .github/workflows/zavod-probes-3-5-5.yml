          FIX=zavod/ops/operator/test_d17_v0_2_fixture.py
          T=$RUNNER_TEMP
          tail -1 "$L" > "$T/line.sh"
          test "$(grep -c '' "$T/line.sh")" = 1
          # 0: the line pins THIS program file: commit, size and SHA-256 written in the line equal the file in that commit
          C=$(grep -o 'ai-devops-system/[0-9a-f]\{40\}/zavod/ops/operator/d17_r2_evidence_v0_2.py' "$T/line.sh" | cut -d/ -f2)
          N=$(grep -o '; N=[0-9]*; ' "$T/line.sh" | tr -dc 0-9)
          S=$(grep -o '; S=[0-9a-f]\{64\}; ' "$T/line.sh" | cut -c5-68)
          git show "$C:$PROG" > "$T/prog_at_c.py"; cmp "$T/prog_at_c.py" "$PROG"
          test "$(stat -c %s "$PROG")" = "$N"; test "$(sha256sum < "$PROG" | cut -d' ' -f1)" = "$S"
          python3 -I -B -c 'import ast,sys; ast.parse(open(sys.argv[1]).read())' "$PROG"
          echo "LINE_PINS commit=$C size=$N sha256=$S"
          # run 1: not root — refused, nothing read, nothing downloaded
          rc=0; bash "$T/line.sh" > "$T/r1.out" 2>&1 || rc=$?; cat "$T/r1.out"; test "$rc" = 1
          test "$(cat "$T/r1.out")" = "REFUSED: run as root; nothing done"
          # stand-in server: files at the real paths, test program = this program with only the PIN block replaced
          sudo python3 -I -B "$FIX" build "$T"
          python3 -I -B "$FIX" prog "$T" "$PROG" "$T/line.sh"
          cmp <(sed 's/; N=[0-9]*; S=[0-9a-f]\{64\}; /; N=; S=; /' "$T/line.sh") <(sed 's/; N=[0-9]*; S=[0-9a-f]\{64\}; /; N=; S=; /' "$T/line_test.sh")
          LID=11111111-2222-4333-8444-555555555555
          PS=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["proof_sha"])' "$T/pin.json")
          # real PostgreSQL with the lease_seal table as on the server
          command -v pg_ctlcluster > /dev/null || { sudo apt-get update && sudo apt-get install -y postgresql; }
          sudo systemctl start postgresql
          printf '%s\n' "CREATE DATABASE bem;" | sudo -u postgres psql -X -q -v ON_ERROR_STOP=1
          printf '%s\n' "CREATE SCHEMA bem_control;" \
            "CREATE TABLE bem_control.lease_seal (lease_id uuid NOT NULL PRIMARY KEY, series text NOT NULL, reason text NOT NULL, proof_sha256 text NOT NULL, sealed_at timestamptz NOT NULL, sealed_by name NOT NULL DEFAULT session_user);" \
            "INSERT INTO bem_control.lease_seal (lease_id, series, reason, proof_sha256, sealed_at) VALUES ('$LID', 'pb1trial2', 'NO_SESSION_PRE_START', '$PS', '2026-11-18 06:17:50+00');" \
            | sudo -u postgres psql -X -q -v ON_ERROR_STOP=1 -d bem
          # the download tool is replaced by a stand-in that records its arguments and serves the test program
          D=$(command -v curl); sudo mv "$D" "$D.real-d17"
          printf '#!/bin/sh\nprintf "%%s\\n" "$@" > %s/stub/args\ncat %s/stub/prog.py\n' "$T" "$T" | sudo tee "$D" > /dev/null
          sudo chmod 755 "$D"
          E=$T/poison; mkdir -p "$E"
          for t in curl python3 sha256sum cut stat find sort wc cat runuser psql basename timeout; do printf '#!/bin/sh\ntouch %s/MARK_%s\nexit 0\n' "$E" "$t" > "$E/$t"; chmod 755 "$E/$t"; done
          run_line() { sudo env PATH="$E:$PATH" BASH_ENV="$E/sha256sum" PYTHONPATH="$E" PYTHONSTARTUP="$E/cat" PGHOST=/nonexistent PGDATABASE=wrong /usr/bin/timeout 120 /bin/dash "$1" > "$2" 2>&1 || true; cat "$2"; if ls "$E" | grep MARK_; then echo POISON_USED; exit 1; fi; }
          no() { if grep -q -e "$1" "$2"; then echo "UNEXPECTED_IN_OUTPUT $1"; exit 1; fi; }
          safe() { no "$LID" "$1"; no SRC_SECRET_MARKER "$1"; no TOPSECRET_MARKER "$1"; no FOREIGN_MARKER "$1"; no otherseries "$1"; tail -1 "$1" | grep -qx D17_DONE; }
          snap() { sudo find /root /var/lib/zavod -printf '%p %y %m %s %T@ %C@\n' 2>/dev/null | grep -v '^/root/\.' | sort; }
          # run 2: root, poisoned calling environment, everything consistent — D17_OK, nothing changed, nothing secret printed
          snap > "$T/before.txt"
          O=$T/r2.out; run_line "$T/line_test.sh" "$O"
          snap > "$T/after.txt"; diff "$T/before.txt" "$T/after.txt"
          safe "$O"; grep -qx 'D17_PROG_OK' "$O"; grep -qx 'D17_OK' "$O"; grep -qx 'RC d17 = 0' "$O"
          for s in r2_out obs proof src db r2_text; do grep -qx "SEC $s PASS" "$O"; done
          if grep -q '^FAIL ' "$O"; then exit 1; fi
          sed -n '/^--- BEGIN R2_OUT$/,/^--- END R2_OUT$/p' "$O" | grep -q '^R2_DIAG {"obs_sha":'
          test "$(grep -c '^OBS obs-[0-9a-f]\{64\}\.json 0:0:0600 links=1 size=[0-9]* sha256=[0-9a-f]\{64\} NAME_MATCH$' "$O")" = 2
          grep -qx 'SERIES_ENTRIES 1:dir' "$O"; grep -qx 'ATTEMPT_ENTRIES proof.json:file,src:dir' "$O"
          grep -q '^PROOF {.*"lease_id_sha256":"'"$(printf '%s' "$LID" | sha256sum | cut -d' ' -f1)"'".*"tool_version":"zprobe-TOOLMARK"' "$O"
          grep -qx 'INVENTORY_SHA_MATCH proof.inventory_sha256' "$O"; test "$(grep -c '^INV ' "$O")" = 2
          grep -q '^SRC zagent.env 0:0:0600 links=1 size=[0-9]* sha256=[0-9a-f]\{64\} MATCH$' "$O"
          grep -qx 'RO on' "$O"; grep -qx 'ROWS_ALL 1' "$O"; grep -qx 'RC psql = 0' "$O"
          sudo cat "$T/stub/args" > "$T/args.txt"; grep -qx -- '--proto' "$T/args.txt"; grep -qx -- '=https' "$T/args.txt"; grep -qx -- '--tlsv1.2' "$T/args.txt"
          grep -qx "https://raw.githubusercontent.com/bereznyi-aleksandr/ai-devops-system/$C/zavod/ops/operator/d17_r2_evidence_v0_2.py" "$T/args.txt"
          grep -qx "$(stat -c %s "$T/stub/prog.py")" "$T/args.txt"
          # negative runs: each starts from a fresh stand-in, changes one thing, must end D17_FAIL with that reason, code 1
          neg() { O=$T/n_$1.out; run_line "$T/line_test.sh" "$O"; safe "$O"; grep -qx 'RC d17 = 1' "$O"; grep -q "^D17_FAIL .*$2" "$O"; if grep -qx D17_OK "$O"; then exit 1; fi; }
          fresh() { sudo python3 -I -B "$FIX" build "$T" > /dev/null; }
          secret() { printf 'TOPSECRET_MARKER\n' | sudo tee /root/secret.txt > /dev/null; sudo chmod 600 /root/secret.txt; }
          R=/root/zprobe-b12-r2-1d4d2caf62e0-20261118T061742Z-505172/zprobe-r2-b12-pb1trial2.out
          A=/var/lib/zavod/seal/pb1trial2/1
          fresh; secret; sudo rm "$R"; sudo ln -s /root/secret.txt "$R"
          neg r2link 'r2_out:'; no '--- BEGIN R2_OUT' "$O"
          fresh; sudo sed -i 's/reason=first/reason=FIRSX/' "$R"
          neg r2diff 'r2_out:sha_diff'; no '--- BEGIN R2_OUT' "$O"; no FIRSX "$O"; grep -q 'r2_text:r2_out_not_verified' "$O"
          fresh; sudo chmod 644 "$R"
          neg r2mode 'r2_out:file_mode'; no '--- BEGIN R2_OUT' "$O"
          fresh; secret; printf 'TOPSECRET_MARKER\n' | sudo tee /var/lib/zavod/r2obs/pb1trial2/notes.txt > /dev/null
          sudo ln -s /root/secret.txt "/var/lib/zavod/r2obs/pb1trial2/obs-$(printf 'a%.0s' $(seq 64)).json"
          sudo mkfifo -m 600 "/var/lib/zavod/r2obs/pb1trial2/obs-$(printf 'b%.0s' $(seq 64)).json"
          neg obsextra 'obs:entry:'; test "$(grep -c '^OBS_SKIP ' "$O")" = 3; grep -qx 'SEC r2_out PASS' "$O"
          fresh; sudo sed -i 's/TOOLMARK/TOOLMARX/' "$A/proof.json"
          neg proofdiff 'proof:sha_diff'; no TOOLMAR "$O"; grep -q 'src:proof_not_verified' "$O"
          fresh; sudo mv "$A/proof.json" "$A/proof.away"
          neg proofmissing 'proof:'
          fresh; sudo mkdir -m 700 /var/lib/zavod/seal/pb1trial2/2
          neg attempt2 'proof:attempts'
          fresh; sudo sed -i 's/SRC_SECRET_MARKER=1/SRC_SECRET_MARKER=2/' "$A/src/zagent.env"
          neg srcdiff 'src:file:zagent.env'; grep -q '^SRC zagent.env .* DIFF$' "$O"
          fresh; sudo sed -i 's/orig_src=0:0:0640/orig_src=0:0:0644/' "$A/src/INVENTORY.sha256"
          neg invdiff 'src:inventory_sha'; no '^INV ' "$O"
          fresh; printf 'x\n' | sudo tee "$A/src/extra" > /dev/null
          neg srcextra 'src:src_set'
          fresh; printf '%s\n' "UPDATE bem_control.lease_seal SET proof_sha256 = repeat('0', 64);" | sudo -u postgres psql -X -q -v ON_ERROR_STOP=1 -d bem
          neg dbdiff 'db:proof_sha'
          printf '%s\n' "UPDATE bem_control.lease_seal SET proof_sha256 = '$PS';" | sudo -u postgres psql -X -q -v ON_ERROR_STOP=1 -d bem
          # a write through the database is refused by the read-only session (the guard the program sets first)
          rc=0; printf '%s\n' "SET default_transaction_read_only = on;" "DELETE FROM bem_control.lease_seal;" | sudo /usr/sbin/runuser -u postgres -- psql -X -A -t -q -v ON_ERROR_STOP=1 -d bem > "$T/r3.out" 2>&1 || rc=$?
          cat "$T/r3.out"; test "$rc" != 0; grep -q 'read-only transaction' "$T/r3.out"
          test "$(printf '%s\n' "SELECT count(*) FROM bem_control.lease_seal;" | sudo -u postgres psql -X -A -t -q -d bem)" = 1
          # served program differs from the pinned size and sum — nothing run
          fresh; printf '#\n' | sudo tee -a "$T/stub/prog.py" > /dev/null
          O=$T/n_prog.out; run_line "$T/line_test.sh" "$O"
          grep -qx 'REFUSED: program size or sum differs; nothing run' "$O"; grep -qx 'RC d17 = 3' "$O"; no '^=== ' "$O"; tail -1 "$O" | grep -qx D17_DONE
          sudo mv "$D.real-d17" "$D"
          echo ZPROBE_B12_D17_READONLY_PASS
  b13-dropin-repro:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: B13 drop-in step of PB-1 reproduced on real systemd (names of changed properties)
        run: |
          set -eu
          sudo python3 -I -B zavod/ops/server/probes/zprobe_dropin_repro.py zavod/ops/server/cell 2>&1 | tee "$RUNNER_TEMP/drepro.out"
          tail -1 "$RUNNER_TEMP/drepro.out" | grep -Fx DREPRO_DONE
          grep -Fx DREPRO_SEMANTIC_OK "$RUNNER_TEMP/drepro.out"
          test "$(grep -c '^DREPRO_VERDICT#[123] result=OK ' "$RUNNER_TEMP/drepro.out")" = 3
          test "$(grep -c '^DREPRO_NEG#.* result=REFUSED .* PASS$' "$RUNNER_TEMP/drepro.out")" = 4
