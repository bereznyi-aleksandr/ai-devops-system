# ВЕРСИЯ: v0.20  СТАТУС: DRAFT  ДАТА СОЗДАНИЯ: 2026-11-13 10:47 +02:00  ДАТА ОБНОВЛЕНИЯ: 2026-11-15 19:02 +02:00
# v0.20 (Claude, терминал zavod; REL72/REL73, preflight на zavod-1): установщик B10 31 (N17–N19 — байт-код B9, две отметки).
# v0.19 (Claude, терминал zavod, чат 976849d6; REL70): export 124 (X53 — сбой fsync папки после возврата метки).
