          test "$(tail -1 "$T/r2.out")" = "STOP after verify-installed (B8-B12 not intact, FAIL, WAIT or unknown result); R2 not run"
          if grep -Eq '^(R2_PROGRAM_OK|R2_OUT)' "$T/r2.out"; then echo UNEXPECTED_R2; exit 1; fi
          # runs 3-6: the accepted R2 program file is placed as install would (root 0644); the B12 verify-installed call and
          # the R2 call of /usr/bin/python3 are answered by a stand-in; the command and the .sh are real
          sudo mkdir -m 0755 -p "$B"; sudo install -o root -g root -m 0644 zavod/ops/server/probes/zprobe_r2.py "$B/zprobe_r2.py"
          sudo mv /usr/bin/python3 /usr/bin/python3.real-zc
