              if sudo grep -v '^PATH=/usr/sbin:/usr/bin:/sbin:/bin$' /root/zc-r2-env | grep -v '^PWD=' | grep -v '^SHLVL=' | grep -v '^_='; then echo R2_ENV_NOT_EMPTY; exit 1; fi
              sudo mv /root/zc-r2-env "/root/zc-r2-env.used-$m"
            fi
          done
          # run 7: a changed R2 program (sum differs) — STOP, R2 not run
          echo safe | sudo tee /root/zc-fake-mode > /dev/null; sudo test ! -e /root/zc-r2-env
          echo '# changed' | sudo tee -a "$B/zprobe_r2.py" > /dev/null
          rc=0; sudo /bin/dash "$L" > "$T/r7.out" 2>&1 || rc=$?; cat "$T/r7.out"; test "$rc" = 1
          test "$(tail -1 "$T/r7.out")" = "STOP: $B/zprobe_r2.py is not the accepted R2 program (folder, owner, links, mode or sum); R2 not run"
          sudo test ! -e /root/zc-r2-env
          sudo mv /usr/bin/python3 /usr/bin/python3.fake-zc; sudo mv /usr/bin/python3.real-zc /usr/bin/python3
          if ls "$E" | grep MARK_; then echo POISON_USED; exit 1; fi
          echo ZPROBE_B12_R2_CMD_PASS

  b12-d17-readonly:
