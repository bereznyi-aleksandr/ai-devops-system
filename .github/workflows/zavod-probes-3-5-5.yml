                grep -qx 'RC verify-installed = 0' "$T/i_$m.out"; grep -qx 'RC report verify-installed = 0' "$T/i_$m.out"
                grep -Eqx 'REPORT_SHA_MATCH [0-9a-f]{64} lines=2' "$T/i_$m.out" ;;
              partial) test "$rc" = 1; test "$last" = 'STOP after install (REFUSED, PARTIAL or unknown result); nothing removed, nothing more run'
                if grep -q '^RC verify-installed' "$T/i_$m.out"; then exit 1; fi ;;
              verifyfail) test "$rc" = 1; test "$last" = 'STOP after verify-installed (FAIL, WAIT or unknown result); nothing removed, report not run'
                if grep -q '^RC report' "$T/i_$m.out"; then exit 1; fi ;;
              badsum) test "$rc" = 1; echo "$last" | grep -Eqx 'STOP after report \(no CHECK lines, FAIL/WAIT, result or REPORT_SHA256 differs; own CHECK sum [0-9a-f]{64} lines=2\)' ;;
              nocheck) test "$rc" = 1; echo "$last" | grep -Eqx 'STOP after report \(no CHECK lines, FAIL/WAIT, result or REPORT_SHA256 differs; own CHECK sum [0-9a-f]{64} lines=0\)' ;;
            esac
          done
          sudo mv /usr/bin/python3 /usr/bin/python3.fake-zc; sudo mv /usr/bin/python3.real-zc /usr/bin/python3
          sudo test ! -e "$B"
          if ls "$E" | grep MARK_; then echo POISON_USED; exit 1; fi
