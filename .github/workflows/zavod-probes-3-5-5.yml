          test "$(cat "$T/i1.out")" = "REFUSED: run as root; nothing done"
          # run 2: the package folder is not there (stage not done) — STOP after the download check, nothing run
          rc=0; sudo /bin/dash "$L" > "$T/i2.out" 2>&1 || rc=$?; cat "$T/i2.out"; test "$rc" = 1
          grep -Eqx 'FILE_OK /root/zprobe-b12-install-1d4d2caf62e0-[0-9]{8}T[0-9]{6}Z-[0-9]+/zprobe-release-3\.5\.5-b12\.sh size=601832 sha256=90c019439d9636186d7860b549e67931b0533264ae0a6acc0cbb640e3f66c176' "$T/i2.out"
