  b12-operator-cmd:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: operator command B12 v0.3 run as given from a poisoned calling environment, settings file, oversize source, report branch (REL115, root)
        run: |
          set -eu
          export LC_ALL=C
          L=zavod/ops/operator/cmd_b12_stage_preflight_v0_3.sh
          T=$RUNNER_TEMP
          P=/var/lib/zavod/probes-pkg-20ae4a839adc
          U=https://raw.githubusercontent.com/bereznyi-aleksandr/ai-devops-system/1d4d2caf62e0824c36ff46596059ed8e5ae01fe1/zavod/ops/server/probes/zprobe-release-3.5.5-b12.sh
          test "$(grep -vc '^#' "$L")" = 1
          tail -1 "$L" | grep -q "^/usr/bin/env -i /bin/bash --norc --noprofile -c '"
          tail -1 "$L" | grep -qF '; curl -q -fsSL --proto =https --proto-redir =https --tlsv1.2 --connect-timeout 30 --max-time 300 --max-filesize "$N" "$U" | head -c "$((N + 1))" > "$F" || die '
          sudo test ! -e "$P"
          sudo test ! -e /root/.curlrc
          sudo mkdir -p /var/lib/zavod && sudo chown root:root /var/lib/zavod && sudo chmod 0755 /var/lib/zavod
          E=$(mktemp -d); mkdir "$E/bin"
          for n in curl sha256sum mkdir stat find bash sh env python3 grep cut date dirname id printf tar base64 sed wc sort cmp head; do
            printf '#!/bin/sh\ntouch %s/MARK_%s\nexit 99\n' "$E" "$n" > "$E/bin/$n"; chmod 755 "$E/bin/$n"
          done
          printf 'touch %s/MARK_BASH_ENV\n' "$E" > "$E/benv"
          # M-355-REL115-01: a root settings file of the download tool that leaves a trace file if it is ever read
          printf 'trace-ascii = "%s/MARK_curlrc"\n' "$E" | sudo tee /root/.curlrc > /dev/null
          sudo ls -1A /root | sort > "$T/root0"; sudo ls -1A /var/lib/zavod | sort > "$T/vlz0"
          # run 1: exactly as the operator pastes it, but the calling environment is poisoned
          rc=0
          sudo env BASH_ENV="$E/benv" ENV="$E/benv" PATH="$E/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            "BASH_FUNC_curl%%=() { touch $E/MARK_fn_curl; }" "BASH_FUNC_mkdir%%=() { touch $E/MARK_fn_mkdir; }" \
            /bin/dash "$L" > "$T/c1.out" 2>&1 || rc=$?
          cat "$T/c1.out"; echo "rc1=$rc"
          if ls "$E" | grep MARK_; then echo POISON_USED; exit 1; fi
          grep -Eqx 'FILE_OK /root/zprobe-b12-1d4d2caf62e0-[0-9]{8}T[0-9]{6}Z-[0-9]+/zprobe-release-3\.5\.5-b12\.sh size=601832 sha256=90c019439d9636186d7860b549e67931b0533264ae0a6acc0cbb640e3f66c176' "$T/c1.out"
          grep -qx 'RC stage = 0' "$T/c1.out"
          grep -qxF "ZPROBE_B12_STAGE=OK $P files=20 (only this new folder was written)" "$T/c1.out"
          test "$(grep -c '^CREATED ' "$T/c1.out")" = 25
          grep -q '^RC preflight = ' "$T/c1.out"
          last=$(tail -1 "$T/c1.out")
          case "$last" in
            CMD_DONE) test "$rc" = 0; grep -q '^REPORT_SHA_MATCH ' "$T/c1.out" ;;
            'STOP after preflight (FAIL, WAIT or unknown result); report not run') test "$rc" = 1; ! grep -q '^RC report' "$T/c1.out" ;;
            *) echo "UNEXPECTED_LAST $last"; exit 1 ;;
          esac
          sudo ls -1A /root | sort > "$T/root1"; sudo ls -1A /var/lib/zavod | sort > "$T/vlz1"
          test -z "$(comm -23 "$T/root0" "$T/root1")"; comm -13 "$T/root0" "$T/root1" > "$T/newroot"
          test "$(wc -l < "$T/newroot")" = 1
          grep -Eqx 'zprobe-b12-1d4d2caf62e0-[0-9]{8}T[0-9]{6}Z-[0-9]+' "$T/newroot"
          D=/root/$(cat "$T/newroot")
          test "$(sudo stat -c %u:%g:%a "$D")" = 0:0:700
          test "$(sudo ls -1A "$D")" = zprobe-release-3.5.5-b12.sh
          test "$(sudo stat -c %u:%g:%a:%h:%s "$D/zprobe-release-3.5.5-b12.sh")" = 0:0:600:1:601832
          test -z "$(comm -23 "$T/vlz0" "$T/vlz1")"; test "$(comm -13 "$T/vlz0" "$T/vlz1")" = probes-pkg-20ae4a839adc
          # run 2: the same command again — a new download folder, then STOP: the package folder exists, nothing run
          rc=0; sudo /bin/dash "$L" > "$T/c2.out" 2>&1 || rc=$?; cat "$T/c2.out"; test "$rc" = 1
          test "$(tail -1 "$T/c2.out")" = "STOP: $P already exists; stage not run"
          if grep -q '^RC ' "$T/c2.out"; then echo UNEXPECTED_RUN; exit 1; fi
          sudo ls -1A /var/lib/zavod | sort | cmp - "$T/vlz1"
          test "$(sudo ls -1A /root | sort | comm -13 "$T/root1" - | wc -l)" = 1
          # run 3: not root — refused before anything
          rc=0; /bin/dash "$L" > "$T/c3.out" 2>&1 || rc=$?; cat "$T/c3.out"; test "$rc" = 1
          test "$(cat "$T/c3.out")" = "REFUSED: run as root; nothing done"
          # this disposable machine only: the used package folder is renamed aside so the next runs can stage again
          sudo mv "$P" "$P.used-run1"
          # run 4 (L-355-REL115-01): the source sends 2000000 bytes (stand-in download program); refused, nothing run
          sudo mv /usr/bin/curl /usr/bin/curl.real-zc
          printf '#!/bin/sh\nprintf "%%s\\n" "$@" > %s/curl_args\nexec head -c 2000000 /dev/zero\n' "$E" | sudo tee /usr/bin/curl > /dev/null
          sudo chmod 755 /usr/bin/curl
          sudo ls -1A /root | sort > "$T/root4"
          rc=0; sudo /bin/dash "$L" > "$T/c4.out" 2>&1 || rc=$?; cat "$T/c4.out"; test "$rc" = 1
          tail -1 "$T/c4.out" | grep -Eqx 'REFUSED: download into new /root/zprobe-b12-1d4d2caf62e0-[0-9]{8}T[0-9]{6}Z-[0-9]+/zprobe-release-3\.5\.5-b12\.sh failed or exceeded limits; /root/zprobe-b12-1d4d2caf62e0-[0-9]{8}T[0-9]{6}Z-[0-9]+ kept as evidence, nothing run'
          if grep -Eq '^(FILE_OK|RC |CREATED )' "$T/c4.out"; then echo UNEXPECTED_RUN; exit 1; fi
          test "$(sudo head -1 "$E/curl_args")" = -q
          sudo ls -1A /root | sort | comm -13 "$T/root4" - > "$T/newroot4"; test "$(wc -l < "$T/newroot4")" = 1
          test "$(sudo stat -c %s "/root/$(cat "$T/newroot4")/zprobe-release-3.5.5-b12.sh")" = 601833
          sudo test ! -e "$P"
