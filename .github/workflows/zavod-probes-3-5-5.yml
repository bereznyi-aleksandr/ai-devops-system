              vfail) test "$rc" = 1; test "$last" = "STOP after verify-installed (B8-B12 not intact, FAIL, WAIT or unknown result); R2 not run"
                sudo test ! -e /root/zc-r2-env ;;
              safe) test "$rc" = 0; test "$last" = "CMD_DONE R2 SAFE_PRE_START"; grep -qx "R2_PROGRAM_OK $B/zprobe_r2.py sha256=bb7ce5f49fdb32de995cad3c475556e0aad80511fc2ebf46bfa2aeca774e8ee9" "$T/r_$m.out"
                grep -Eq '^R2_OUT=/root/zprobe-b12-r2-1d4d2caf62e0-[0-9]{8}T[0-9]{6}Z-[0-9]+/zprobe-r2-b12-pb1trial2\.out size=[0-9]+ sha256=[0-9a-f]{64} rc=0$' "$T/r_$m.out" ;;
              blocked) test "$rc" = 1; test "$last" = "STOP: R2 rc=1, not SAFE_PRE_START; do not repeat; send the whole output"
                d=$(grep '^R2_DIAG ' "$T/r_$m.out"); test "${#d}" -gt 240; echo "$d" | grep -q '"end"\]}$'
                o=$(grep '^R2_OBS {' "$T/r_$m.out"); test "${#o}" = 240
                grep -Eq '^R2_OUT=.* rc=1$' "$T/r_$m.out" ;;
