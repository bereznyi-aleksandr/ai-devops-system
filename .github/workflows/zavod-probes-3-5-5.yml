# v0.17 (Claude, терминал zavod, чат 3a6de98b; REL68): export 122 (X48–X51), dropin 21 (D21 — CI 28).
# v0.16 (Claude, терминал zavod, чат cb6b67c5; REL65): проверок checks 52 (K41–K49), export 70 (R21–R24, L01–L05, X19–X27, Y07–Y14).
# v0.15 (Claude, чат «напарник · 04» (869221b9), помощник; проект v0.18 раздел 7): установщик и сборщик B10 —
#   zprobe_release_b10.py, build_release_3_5_5_b10.py, test_zprobe_release_b10.py (31 проверка, под sudo); службы
#   zprobe-run-b10@ и zprobe-journal-b10@ — в systemd-analyze verify (программы в /usr/local/lib/zavod/probes-b10).
# v0.14 (чат «напарник · 04»; проект v0.18 1.6): шаг R2 — zprobe_r2.py и test_zprobe_r2.py (12 проверок, под sudo).
# v0.13 (чат «напарник · 04», 869221b9; проект v0.18 раздел 5): канал выгрузки — zprobe_export_rules.py,
#   zprobe_export.py, zevidence_send.py, zprobe_verify_export.py и test_zprobe_export.py (44 проверки, под sudo).
# v0.12 (чат «напарник · 04», 869221b9; проект v0.18 1.3 H9 б и 4.1): zprobe_unstarted.py и test_zprobe_unstarted.py
#   (32 проверки: 22 без root, 10 под sudo), установка zprobe_checks/seal/unstarted рядом с бегунком.
# v0.11 (чат «напарник · 03»; проект v0.18 1.3): zprobe_checks.py и test_zprobe_checks.py (42 проверки evaluate H1–H10, без root).
# v0.10 (чат «напарник · 03»): шаги установки ставят zprobe_dropin.py рядом с бегунком (прогон 43643166772: ModuleNotFoundError).
