              printf '%s\n' "$L1" "$L2" 'ZPROBE_B12_VERIFY_INSTALLED=OK fails=0'; exit 0 ;;
          esac
          case "$M" in
            badsum) printf '%s\n' "$L1" "$L2" "REPORT_SHA256=$(printf x | sha256sum | cut -d' ' -f1) lines=2 (x)" 'ZPROBE_B12_VERIFY_INSTALLED=OK fails=0' ;;
            nocheck) printf '%s\n' "REPORT_SHA256=$(printf '' | sha256sum | cut -d' ' -f1) lines=0 (x)" 'ZPROBE_B12_VERIFY_INSTALLED=OK fails=0' ;;
            *) H=$(printf '%s\n' "$L1" "$L2" | sha256sum | cut -d' ' -f1)
              printf '%s\n' "$L1" "$L2" "REPORT_SHA256=$H lines=2 (stdout only, no file written; diagnostics, not a permission)" 'ZPROBE_B12_VERIFY_INSTALLED=OK fails=0' ;;
          esac
          exit 0
          FAKE
          sudo chmod 755 /usr/bin/python3
          for m in good partial verifyfail badsum nocheck; do
            echo "$m" | sudo tee /root/zc-fake-mode > /dev/null
            rc=0; sudo /bin/dash "$L" > "$T/i_$m.out" 2>&1 || rc=$?; cat "$T/i_$m.out"
            grep -qx 'RC preflight = 0' "$T/i_$m.out"
            last=$(tail -1 "$T/i_$m.out")
            case "$m" in
