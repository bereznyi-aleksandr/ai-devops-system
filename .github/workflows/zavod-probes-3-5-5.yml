          if grep -q '^RC install' "$T/i3.out"; then echo UNEXPECTED_INSTALL; exit 1; fi
          sudo test ! -e "$B"
          sudo ls -1A /root | sort | comm -13 "$T/root3" - > "$T/newroot3"; test "$(wc -l < "$T/newroot3")" = 1
          grep -Eqx 'zprobe-b12-install-1d4d2caf62e0-[0-9]{8}T[0-9]{6}Z-[0-9]+' "$T/newroot3"
          D=/root/$(cat "$T/newroot3")
          test "$(sudo stat -c %u:%g:%a "$D")" = 0:0:700
          test "$(sudo stat -c %u:%g:%a:%h:%s "$D/zprobe-release-3.5.5-b12.sh")" = 0:0:600:1:601832
          # runs 4-8: only the B12 installer call of /usr/bin/python3 is answered by a stand-in; the command and the .sh are real
          sudo mv /usr/bin/python3 /usr/bin/python3.real-zc
          sudo tee /usr/bin/python3 > /dev/null <<'FAKE'
          #!/bin/sh
          case "$*" in *zavod/ops/server/probes/zprobe_release_b12.py*) ;; *) exec /usr/bin/python3.real-zc "$@";; esac
          M=$(cat /root/zc-fake-mode)
          L1='CHECK B8 OK stand-in installed'; L2='CHECK B11 OK stand-in installed'
          case "$4" in
            preflight) printf '%s\n' "$L1" "$L2" 'ZPROBE_B12_PREFLIGHT=OK fails=0'; exit 0 ;;
            install)
