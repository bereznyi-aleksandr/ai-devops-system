    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: operator command D17 v0.2 read-only evidence of the second R2 (pinned program, checked reads, inventory, D17_OK/D17_FAIL)
