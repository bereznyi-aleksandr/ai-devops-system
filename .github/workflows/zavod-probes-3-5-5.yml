#   S28–S40 и S43–S55 (папки, права, порядок печати 4.4) — под sudo; итог ZPROBE_SEAL_TEST=PASS, PASS_NO_ROOT не принимается) на x64 и Arm64.
# v0.8 (чат «· 09»): лишний знак переноса в списке разбора убран; задание b9-systemd проверяет замороженный B9
#   (ba9c5aae), а не HEAD B10 — иначе I0c падает на любом файле B10 (прогон 43640633883).
# v0.7 (чат «· 09», 3037f186; код B10, проект v0.18 раздел 2): модуль zprobe_dropin.py и его испытания
#   test_zprobe_dropin.py (20, итог ZPROBE_DROPIN_TEST=PASS) на x64 и Arm64.
# v0.6 (чат «· 05», c241e855; код B9): 228 испытаний; пробный выпуск B8 (шаг release) снят — выпуск B8 уже
#   установлен на сервере, HEAD — код B9; новое задание b9-systemd: zprobe_b9_ci.sh в настоящем systemd на x64 и
#   Arm64 (установка B9 рядом с B8 и проверки завершения серий 1–17, изоляция службы журнала).
# v0.5 (чат «· 05», c241e855; проба pb1trial1): шаг «unit in real systemd» — zprobe_unit_ci.sh запускает службу из
#   настоящего zprobe-run@.service в systemd машины CI: у строки «+» есть сеть хоста (D1), файлы put_new — 0640
#   root:zprobe при UMask=0077 и читаются строкой журнала от zprobe (D2), у строки журнала AF_INET запрещён.
# ИСПОЛНИТЕЛЬ: Claude (v0.1–v0.3 — чат «Завод 3.5.5 ПБ-1 · 03», 1bcc7ca2; v0.4 — чат «· 04», 70d36cf5)
# НАЗНАЧЕНИЕ: проект DESIGN_3_5_5_PB1_v0_13.md §11 (R2 L-09, R3 L-02, R5 L-01) — часть проверок выпуска без сервера:
#   разбор Python и bash -n, shellcheck, test_zprobe.py на Linux x64 и Arm64 (как zavod-1, Ubuntu 24.04) с отказом,
#   если пропущено что-то, кроме 174–175 (они только для Windows), и systemd-analyze verify службы прогона на
#   одноразовой машине GitHub (файлы кладутся в те же пути, соседние службы — пустышки). Сервер, телефон и сеть
#   GitHub с ключами здесь не участвуют; секретов нет.
#   v0.2: шаг release — пробная сборка выпуска (build_release_3_5_5.py) и `bash zprobe-release-3.5.5.sh check` от root
#   на одноразовой машине: все 14 строк CHECK есть, нет падений Python, 01, 10 и 14 (испытания от root) — OK;
#   после коммита с zprobe_pins.txt — `--verify` (выпуск в дереве = сборке из release_commit).
#   v0.3: пробный выпуск запускается командой оператора operator_command_3_5_5.txt (адрес file://): первый запуск,
#   повтор (пакет не распаковывается заново) и чужая сумма (файл отложен, ничего не запущено).
#   v0.4 (аудит ChatGPT REL1): испытания выпуска test_zprobe_release.py (без root); ровно 185 испытаний; после
#   коммита с pins — B отличается от release_commit ровно двумя файлами (M-06); чужая сумма — файл остаётся на месте;
#   лишний файл в папке пакета — отказ повтора; не root — отказ; обязательные строки CHECK 15 и 16.
# ОГРАНИЧЕНИЯ: ничего не удаляет в хранилище; испытания пишут только в новую папку $RUNNER_TEMP/zprobe_tests.
name: zavod-probes-3-5-5
on:
  push:
    paths:
      - zavod/ops/server/probes/**
      - zavod/ops/phone/**
      - zavod/ops/pc/**
      - zavod/ops/zprobe_pins.txt
      - zavod/ops/zprobe_pins_b8.txt
      - .github/workflows/zavod-probes-3-5-5.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: versions
        run: uname -m && python3 --version && git --version && curl --version | head -1 && systemctl --version | head -1
      - name: syntax
        run: |
          set -eu
          cd zavod/ops
          python3 -I -B -c "import ast,sys; [ast.parse(open(f,encoding='utf-8').read(),f) for f in sys.argv[1:]]; print('AST_OK', len(sys.argv)-1)" \
            server/probes/pb1_session.py server/probes/zprobe_rules.py server/probes/zprobe_runner.py \
            server/probes/zprobe_journal.py server/probes/test_zprobe.py phone/zprobe_verify.py pc/zprobe_refs_check.py \
            server/probes/zprobe_release.py server/probes/build_release_3_5_5.py server/probes/test_zprobe_release.py \
            server/probes/zprobe_release_b9.py server/probes/build_release_3_5_5_b9.py server/probes/ci_b9/*.py \
            server/probes/zprobe_dropin.py server/probes/test_zprobe_dropin.py \
            server/probes/zprobe_seal.py server/probes/test_zprobe_seal.py \
            server/probes/zprobe_checks.py server/probes/test_zprobe_checks.py \
            server/probes/zprobe_unstarted.py server/probes/test_zprobe_unstarted.py \
            server/probes/zprobe_export_rules.py server/probes/zprobe_export.py server/probes/zevidence_send.py \
            server/probes/zprobe_verify_export.py server/probes/test_zprobe_export.py \
            server/probes/zprobe_r2.py server/probes/test_zprobe_r2.py \
            server/probes/zprobe_release_b10.py server/probes/build_release_3_5_5_b10.py server/probes/test_zprobe_release_b10.py
          for f in server/probes/zprobe-start server/probes/zprobe_unit_ci.sh server/probes/zprobe_b9_ci.sh phone/zprobe_series.sh pc/zprobe_refs.sh; do bash -n "$f"; echo "BASH_N_OK $f"; done
      - name: shellcheck
        run: shellcheck -S warning zavod/ops/server/probes/zprobe-start zavod/ops/server/probes/zprobe_unit_ci.sh zavod/ops/server/probes/zprobe_b9_ci.sh zavod/ops/phone/zprobe_series.sh zavod/ops/pc/zprobe_refs.sh
      - name: tests
        run: |
          set -eu
          R="$RUNNER_TEMP/zprobe_tests"
          mkdir "$R"
          cd zavod/ops/server/probes
          ZPROBE_TEST_ROOT="$R" python3 -I -B test_zprobe.py 2>&1 | tee "$RUNNER_TEMP/zprobe_test.out"
          tail -1 "$RUNNER_TEMP/zprobe_test.out" | grep -E '^ZPROBE_TESTS 248/248 PASS$'
          if grep '^SKIP' "$RUNNER_TEMP/zprobe_test.out" | grep -v '^SKIP 174, 175 (Windows only)'; then
            echo "UNEXPECTED_SKIP: on Linux only 174-175 may be skipped"; exit 1
          fi
          echo "LINUX_ALL_REAL_EXCEPT_174_175"
          test -z "$(find . -name __pycache__)" && echo "NO_PYCACHE_IN_SOURCES"
      - name: release tests (no root)
        run: |
          set -eu
          R="$RUNNER_TEMP/zprobe_release_tests"
          mkdir "$R"
          ZPROBE_TEST_ROOT="$R" python3 -I -B zavod/ops/server/probes/test_zprobe_release.py 2>&1 | tee "$RUNNER_TEMP/zrel.out"
          tail -1 "$RUNNER_TEMP/zrel.out" | grep -E '^ZPROBE_RELEASE_TESTS ([0-9]+)/\1 PASS$'
          if grep '^SKIP' "$RUNNER_TEMP/zrel.out"; then echo "UNEXPECTED_SKIP in release tests"; exit 1; fi
          echo "RELEASE_TESTS_ALL_REAL"
      - name: B10 drop-in record tests (design v0.18 section 2)
        run: |
          set -eu
          R="$RUNNER_TEMP/zprobe_dropin_tests"
          mkdir "$R"
          ZPROBE_TEST_ROOT="$R" python3 -I -B zavod/ops/server/probes/test_zprobe_dropin.py 2>&1 | tee "$RUNNER_TEMP/zdrop.out"
          test "$(grep -c '^CASE D[0-9]* .* PASS$' "$RUNNER_TEMP/zdrop.out")" = 21
          tail -1 "$RUNNER_TEMP/zdrop.out" | grep -qx 'ZPROBE_DROPIN_TEST=PASS'
          echo ZPROBE_DROPIN_21_PASS
      - name: B10 seal proof and attempts tests (design v0.18 4.3/4.4, root)
        run: |
          set -eu
          sudo python3 -I -B zavod/ops/server/probes/test_zprobe_seal.py 2>&1 | tee "$RUNNER_TEMP/zseal.out"
          test "$(grep -c '^CASE S[0-9]* .* PASS$' "$RUNNER_TEMP/zseal.out")" = 55
          if grep -q ' SKIP ' "$RUNNER_TEMP/zseal.out"; then echo UNEXPECTED_SKIP; exit 1; fi
          tail -1 "$RUNNER_TEMP/zseal.out" | grep -qx 'ZPROBE_SEAL_TEST=PASS'
          echo ZPROBE_SEAL_55_PASS
      - name: B10 checks H1-H10 evaluate tests (design v0.18 1.3, no root)
        run: |
          set -eu
          python3 -I -B zavod/ops/server/probes/test_zprobe_checks.py 2>&1 | tee "$RUNNER_TEMP/zchk.out"
          test "$(grep -c '^CASE K[0-9]* .* PASS$' "$RUNNER_TEMP/zchk.out")" = 58
          tail -1 "$RUNNER_TEMP/zchk.out" | grep -qx 'ZPROBE_CHECKS_TEST=PASS'
          echo ZPROBE_CHECKS_58_PASS
      - name: B10 cleanup without session and runner anchor tests (design v0.18 1.3 H9 b, 4.1, root)
        run: |
          set -eu
          sudo python3 -I -B zavod/ops/server/probes/test_zprobe_unstarted.py 2>&1 | tee "$RUNNER_TEMP/zunst.out"
          test "$(grep -c '^CASE U[0-9]* .* PASS$' "$RUNNER_TEMP/zunst.out")" = 33
          if grep -q ' SKIP ' "$RUNNER_TEMP/zunst.out"; then echo UNEXPECTED_SKIP; exit 1; fi
          tail -1 "$RUNNER_TEMP/zunst.out" | grep -qx 'ZPROBE_UNSTARTED_TEST=PASS'
          echo ZPROBE_UNSTARTED_33_PASS
      - name: B10 export channel tests (design v0.18 section 5, root)
        run: |
          set -eu
          sudo python3 -I -B zavod/ops/server/probes/test_zprobe_export.py 2>&1 | tee "$RUNNER_TEMP/zexp.out"
          test "$(grep -c '^CASE [RXYL][0-9][0-9]_[^ ]* PASS$' "$RUNNER_TEMP/zexp.out")" = 124
          if grep -q ' SKIP' "$RUNNER_TEMP/zexp.out"; then echo UNEXPECTED_SKIP; exit 1; fi
          tail -1 "$RUNNER_TEMP/zexp.out" | grep -qx 'ZPROBE_EXPORT_TEST=PASS'
          echo ZPROBE_EXPORT_44_PASS
      - name: B10 R2 seal of pb1trial2 residue tests (design v0.18 1.6, root)
        run: |
          set -eu
          sudo python3 -I -B zavod/ops/server/probes/test_zprobe_r2.py 2>&1 | tee "$RUNNER_TEMP/zr2.out"
          test "$(grep -c '^CASE T[0-9][0-9]_[^ ]* PASS$' "$RUNNER_TEMP/zr2.out")" = 13
          if grep -q ' SKIP' "$RUNNER_TEMP/zr2.out"; then echo UNEXPECTED_SKIP; exit 1; fi
          tail -1 "$RUNNER_TEMP/zr2.out" | grep -qx 'ZPROBE_R2_TEST=PASS'
          echo ZPROBE_R2_13_PASS
      - name: B10 release installer and builder tests (design v0.18 section 7, 1.3 B, root)
        run: |
          set -eu
          sudo python3 -I -B zavod/ops/server/probes/test_zprobe_release_b10.py 2>&1 | tee "$RUNNER_TEMP/zrel10.out"
          test "$(grep -c '^CASE N[0-9][0-9]_[^ ]* PASS$' "$RUNNER_TEMP/zrel10.out")" = 31
          if grep -q ' SKIP' "$RUNNER_TEMP/zrel10.out"; then echo UNEXPECTED_SKIP; exit 1; fi
          tail -1 "$RUNNER_TEMP/zrel10.out" | grep -qx 'ZPROBE_RELEASE_B10_TEST=PASS'
          echo ZPROBE_RELEASE_B10_31_PASS
      - name: systemd-analyze verify
        run: |
          set -eu
          sudo install -d -m 0755 /usr/local/lib/zavod/probes
          for f in pb1_session.py zprobe_rules.py zprobe_runner.py zprobe_dropin.py zprobe_checks.py zprobe_seal.py zprobe_unstarted.py zprobe_journal.py zprobe-start; do
            sudo install -m 0755 "zavod/ops/server/probes/$f" "/usr/local/lib/zavod/probes/$f"
          done
          sudo install -m 0644 zavod/ops/server/probes/zprobe-run@.service /etc/systemd/system/zprobe-run@.service
          for u in zavod-proxy zavod-nft; do
            printf '[Unit]\nDescription=stub %s for verify only\n[Service]\nType=oneshot\nExecStart=/bin/true\n' "$u" \
              | sudo tee "/etc/systemd/system/$u.service" > /dev/null
          done
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin zprobe
          sudo systemctl daemon-reload
          sudo systemd-analyze verify /etc/systemd/system/zprobe-run@.service zprobe-run@S1.service 2>&1 | tee "$RUNNER_TEMP/verify.out"
          if grep -v -E '^$' "$RUNNER_TEMP/verify.out"; then echo "VERIFY_HAS_OUTPUT (see above)"; exit 1; fi
          echo "SYSTEMD_VERIFY_OK"
          # v0.15: службы B10 из дерева — программы в /usr/local/lib/zavod/probes-b10, как ставит zprobe_release_b10.py
          sudo install -d -m 0755 /usr/local/lib/zavod/probes-b10
          for f in pb1_session.py zprobe_rules.py zprobe_runner.py zprobe_dropin.py zprobe_checks.py zprobe_seal.py zprobe_unstarted.py zprobe_export_rules.py zprobe_export.py zprobe_r2.py zevidence_send.py zprobe_journal.py zprobe-start; do
            sudo install -m 0755 "zavod/ops/server/probes/$f" "/usr/local/lib/zavod/probes-b10/$f"
          done
          for u in zprobe-run-b10@.service zprobe-journal-b10@.service; do
            sudo install -m 0644 "zavod/ops/server/probes/$u" "/etc/systemd/system/$u"
          done
          sudo systemctl daemon-reload
          sudo systemd-analyze verify /etc/systemd/system/zprobe-run-b10@.service zprobe-run-b10@S1.service \
            /etc/systemd/system/zprobe-journal-b10@.service zprobe-journal-b10@S1.service 2>&1 | tee "$RUNNER_TEMP/verify_b10.out"
          if grep -v -E '^$' "$RUNNER_TEMP/verify_b10.out"; then echo "VERIFY_B10_HAS_OUTPUT (see above)"; exit 1; fi
          echo "SYSTEMD_VERIFY_B10_OK"
      - name: unit in real systemd (D1 network of the + line, D2 file modes under UMask)
        run: |
          set -eu
          sudo bash zavod/ops/server/probes/zprobe_unit_ci.sh zavod/ops/server/probes 2>&1 | tee "$RUNNER_TEMP/zunit.out"
          tail -1 "$RUNNER_TEMP/zunit.out" | grep -Fx ZPROBE_UNIT_CI_OK
      - name: sha256
        run: |
          cd zavod/ops
          sha256sum server/probes/pb1_session.py server/probes/zprobe_rules.py server/probes/zprobe_runner.py \
            server/probes/zprobe_journal.py server/probes/zprobe-start server/probes/zprobe-run@.service \
            server/probes/test_zprobe.py phone/zprobe_verify.py phone/zprobe_series.sh pc/zprobe_refs.sh pc/zprobe_refs_check.py \
            server/probes/zprobe_release.py server/probes/build_release_3_5_5.py server/probes/test_zprobe_release.py \
            server/probes/zprobe_release_b9.py server/probes/build_release_3_5_5_b9.py server/probes/zprobe_b9_ci.sh \
            server/probes/zprobe-run-b9@.service server/probes/zprobe-journal-b9@.service server/probes/ci_b9/*.py zprobe_pins_b8.txt \
            server/probes/zprobe-run-b10@.service server/probes/zprobe-journal-b10@.service server/probes/zprobe_release_b10.py \
            server/probes/build_release_3_5_5_b10.py server/probes/test_zprobe_release_b10.py zprobe_pins_b9.txt
  b9-systemd:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          # v0.8: B9 is frozen and installed; its release check (I0c) runs on the last B9 tree, not on B10 HEAD
          ref: ba9c5aaeba4d1a0cc2996bfcd215b9845ed609c0
      - name: B9 in real systemd (install beside B8, completion of series, journal unit isolation)
        run: |
          set -eu
          sudo bash zavod/ops/server/probes/zprobe_b9_ci.sh . 2>&1 | tee "$RUNNER_TEMP/zb9.out"
          grep -E '^CI .* FAIL' "$RUNNER_TEMP/zb9.out" || true
          tail -1 "$RUNNER_TEMP/zb9.out" | grep -Fx ZPROBE_COMPLETION_CI_OK
