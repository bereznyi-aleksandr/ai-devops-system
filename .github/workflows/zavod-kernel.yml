          DLR=$(sudo find "$DL" -type f -printf '%u:%g %m\n' | sort -u)
          [ "$DLR" = 'root:root 400' ] || { echo "DL_RIGHTS=[$DLR]"; sudo find "$DL" -printf '%M %U:%G %s %p\n'; exit 1; }
          test ! -e /etc/apt/sources.list.d/google-chrome.sources; test ! -e /etc/apt/sources.list.d/google-chrome.list
          apt-mark showhold | grep -x google-chrome-stable > /dev/null
          R1=$(sed -n 's/^--- отчёт \(\/root\/zavod-install-3\.5\.1b-[^ ]*\.txt\) (sha256 .*/\1/p' "$RUNNER_TEMP/b_first.out"); test -n "$R1"
          test "$(sudo stat -c '%U %a' "$R1")" = 'root 600'
          sudo grep -qx ZAVOD_3_5_1B=OK "$R1"
          echo STAGE351B_FIRST=OK
          # (б) повтор: ничего не скачивается и не распаковывается заново (опись до inode и ctime та же), новый отчёт
