          bsnap > "$RUNNER_TEMP/b_snap1.txt"
          cissh "$(opcmd)" | tee "$RUNNER_TEMP/b_again.out"
          test "$(grep -c '^DOWNLOAD_REUSED=' "$RUNNER_TEMP/b_again.out")" = 3
          test "$(grep -c '^TOOL_REUSED=' "$RUNNER_TEMP/b_again.out")" = 2
          grep -qx 'CHROME_REUSED=157.0.8103.38-1 (already installed, not installed again)' "$RUNNER_TEMP/b_again.out"
          grep -qx ZAVOD_3_5_1B=OK "$RUNNER_TEMP/b_again.out"
          if grep -q '^DOWNLOAD=OK \|^TOOL_UNPACKED=\|^CHROME_INSTALLED=' "$RUNNER_TEMP/b_again.out"; then exit 1; fi
          bsnap > "$RUNNER_TEMP/b_snap2.txt"
          diff "$RUNNER_TEMP/b_snap1.txt" "$RUNNER_TEMP/b_snap2.txt"
          R2=$(sed -n 's/^--- отчёт \(\/root\/zavod-install-3\.5\.1b-[^ ]*\.txt\) (sha256 .*/\1/p' "$RUNNER_TEMP/b_again.out"); test -n "$R2"; test "$R1" != "$R2"
          sudo grep -qx ZAVOD_3_5_1B=OK "$R1"
          echo STAGE351B_REPEAT_NO_WRITE=OK
          P=/root/zavod-pkg-$C12; S="$P/$V/install_stage_3_5_1b.sh"
          # (в) лишний параметр — отказ до изменений
          if cissh "bash $S $P extra" > "$RUNNER_TEMP/b_arg.out" 2>&1; then exit 1; fi
          chk 'REFUSED: unexpected arguments after the package folder: nothing changed' "$RUNNER_TEMP/b_arg.out"
          # (в2) аудит L-351B-R1B-03: не внутри сессии SSH (как в окне телефона) — отказ до изменений
          if sudo bash "$S" "$P" > "$RUNNER_TEMP/b_nossh.out" 2>&1; then exit 1; fi
          chk 'REFUSED: run only inside an SSH root session on the server: nothing changed' "$RUNNER_TEMP/b_nossh.out"
          # (г) изменённый и лишний файл в папке программы — отказ, ничего не изменено; после возврата — OK
          sudo cp -p "$CL/README.md" "$RUNNER_TEMP/b_readme.keep"
          printf 'x' | sudo tee -a "$CL/README.md" > /dev/null
          if cissh "bash $S $P" > "$RUNNER_TEMP/b_changed.out" 2>&1; then cat "$RUNNER_TEMP/b_changed.out"; exit 1; fi
          chk "REFUSED: $CL differs from claude-code-linux-arm64-2.1.318.tgz (2 lines): nothing changed" "$RUNNER_TEMP/b_changed.out"
          sudo cp -p "$RUNNER_TEMP/b_readme.keep" "$CL/README.md"
          sudo install -o root -g root -m 0644 /dev/null "$CX/zz_extra"
          if cissh "bash $S $P" > "$RUNNER_TEMP/b_extra.out" 2>&1; then cat "$RUNNER_TEMP/b_extra.out"; exit 1; fi
          chk "REFUSED: $CX differs from codex-0.166.0-linux-arm64.tgz (1 lines): nothing changed" "$RUNNER_TEMP/b_extra.out"
          sudo mv -n "$CX/zz_extra" "$RUNNER_TEMP/b_zz_extra.aside"
          # (д) другой /etc/default/google-chrome и чужой источник Google — отказ до изменений
          sudo cp -p /etc/default/google-chrome "$RUNNER_TEMP/b_def.keep"
          printf 'repo_add_once="true"\n' | sudo tee /etc/default/google-chrome > /dev/null
          if cissh "bash $S $P" > "$RUNNER_TEMP/b_def.out" 2>&1; then exit 1; fi
          chk 'REFUSED: /etc/default/google-chrome exists and differs: nothing changed' "$RUNNER_TEMP/b_def.out"
          sudo cp -p "$RUNNER_TEMP/b_def.keep" /etc/default/google-chrome
          sudo install -o root -g root -m 0644 /dev/null /etc/apt/sources.list.d/google-chrome.list
          if cissh "bash $S $P" > "$RUNNER_TEMP/b_src.out" 2>&1; then exit 1; fi
          chk 'REFUSED: /etc/apt/sources.list.d/google-chrome.list exists (Google update source): nothing changed' "$RUNNER_TEMP/b_src.out"
          sudo mv -n /etc/apt/sources.list.d/google-chrome.list "$RUNNER_TEMP/b_src.aside"
          # аудит M-351B-R1B-02: источник Google под другим именем файла (.sources и .list) — отказ до изменений
          printf 'Types: deb\nURIs: https://dl.google.com/linux/chrome/deb/\nSuites: stable\nComponents: main\n' \
            | sudo tee /etc/apt/sources.list.d/zz-other.sources > /dev/null
          if cissh "bash $S $P" > "$RUNNER_TEMP/b_src2.out" 2>&1; then exit 1; fi
          chk 'REFUSED: APT source /etc/apt/sources.list.d/zz-other.sources points to dl.google.com' "$RUNNER_TEMP/b_src2.out"
          sudo mv -n /etc/apt/sources.list.d/zz-other.sources "$RUNNER_TEMP/b_src2.aside"
          printf 'deb [arch=arm64] http://dl.google.com/linux/chrome/deb/ stable main\n' | sudo tee /etc/apt/sources.list.d/zz-other.list > /dev/null
          if cissh "bash $S $P" > "$RUNNER_TEMP/b_src3.out" 2>&1; then exit 1; fi
          chk 'REFUSED: APT source /etc/apt/sources.list.d/zz-other.list points to dl.google.com' "$RUNNER_TEMP/b_src3.out"
          sudo mv -n /etc/apt/sources.list.d/zz-other.list "$RUNNER_TEMP/b_src3.aside"
          # (ж) незавершённый чужой пакет (распакован, не настроен) — отказ до изменений: чужое шаг не доводит
          DM=$RUNNER_TEMP/dummy; mkdir -p "$DM/DEBIAN"
          printf 'Package: zavod-ci-dummy\nVersion: 1\nArchitecture: all\nMaintainer: ci <ci@example.invalid>\nDescription: CI probe\n' > "$DM/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$DM" "$RUNNER_TEMP/dummy.deb" > /dev/null
          sudo dpkg --unpack "$RUNNER_TEMP/dummy.deb" > /dev/null
          if cissh "bash $S $P" > "$RUNNER_TEMP/b_foreign.out" 2>&1; then exit 1; fi
          chk "REFUSED: dpkg has unfinished work not started by this step (packages: zavod-ci-dummy 1 unpacked; journal entries: " "$RUNNER_TEMP/b_foreign.out"
          sudo dpkg --configure zavod-ci-dummy > /dev/null
          # (ж2) аудит M-351B-R2-02: запись в журнале dpkg без открытой установки шага (прежние планы закрыты) — отказ
          sudo sh -c 'dpkg-query -s zavod-ci-dummy > /var/lib/dpkg/updates/0000'
          if cissh "bash $S $P" > "$RUNNER_TEMP/b_journal.out" 2>&1; then cat "$RUNNER_TEMP/b_journal.out"; exit 1; fi
          chk "REFUSED: dpkg has unfinished work not started by this step (packages: ; journal entries: 1;" "$RUNNER_TEMP/b_journal.out"
          sudo test -n "$(sudo find "$EVD" -maxdepth 1 -name 'chrome-apt-closed-*.txt')"
          sudo test ! -e "$EVD/chrome-apt-open.txt"
          sudo dpkg --set-selections < /dev/null
          test "$(sudo find /var/lib/dpkg/updates -mindepth 1 | wc -l)" = 0
          # (з) аудит M-351B-R2-03: ссылка вместо папки в своей папке apt — отказ до записи, чужая папка пуста
          sudo install -d -o root -g root -m 0755 /var/lib/zavod-ci-target
          sudo mv -n "$EVD/apt/sources" /var/lib/zavod-ci-aside-sources
          sudo ln -s /var/lib/zavod-ci-target "$EVD/apt/sources"
          if cissh "bash $S $P" > "$RUNNER_TEMP/b_aptlink.out" 2>&1; then cat "$RUNNER_TEMP/b_aptlink.out"; exit 1; fi
          chk "REFUSED: $EVD/apt has a link, a foreign owner or a foreign entry ($EVD/apt/sources): nothing changed" "$RUNNER_TEMP/b_aptlink.out"
          test -z "$(sudo find /var/lib/zavod-ci-target -mindepth 1)"
          sudo mv -n "$EVD/apt/sources" "$RUNNER_TEMP/b_aptlink.aside"
          sudo mv -n /var/lib/zavod-ci-aside-sources "$EVD/apt/sources"
          echo STAGE351B_APT_LINK=OK
          # (е) испорченный файл хранилища — отказ, файл отложен в bad-*; повтор качает его заново, папка не трогается
          printf 'x' | sudo tee -a "$DL/codex-0.166.0-linux-arm64.tgz" > /dev/null
          if cissh "bash $S $P" > "$RUNNER_TEMP/b_bad.out" 2>&1; then cat "$RUNNER_TEMP/b_bad.out"; exit 1; fi
          chk "REFUSED: $DL/codex-0.166.0-linux-arm64.tgz differs from the pin (size, sum or rights): set aside as $EVD/bad-[A-Za-z0-9]\{6\}/codex-0.166.0-linux-arm64.tgz" "$RUNNER_TEMP/b_bad.out"
          sudo test ! -e "$DL/codex-0.166.0-linux-arm64.tgz"
          test "$(sudo sh -c "ls $EVD/bad-*/codex-0.166.0-linux-arm64.tgz" | wc -l)" = 1
          cissh "bash $S $P" | tee "$RUNNER_TEMP/b_back.out"
          grep -qx 'DOWNLOAD=OK codex-0.166.0-linux-arm64.tgz size=164402913 sha256=9044e840397864fc6c539d13719b25fb26abb35d5353366cbabf7b4555406acd' "$RUNNER_TEMP/b_back.out"
          test "$(grep -c '^TOOL_REUSED=' "$RUNNER_TEMP/b_back.out")" = 2
          grep -qx ZAVOD_3_5_1B=OK "$RUNNER_TEMP/b_back.out"
          echo STAGE351B_REFUSALS=OK
          # (и) аудит M-351B-R3-03: другой .deb с тем же именем и версией Chrome (свои суммы файлов) — отказ
          FK=$RUNNER_TEMP/fakechrome; mkdir -p "$FK/DEBIAN" "$FK/opt/google/chrome"
          printf 'Package: google-chrome-stable\nVersion: 157.0.8103.38-1\nArchitecture: arm64\nMaintainer: ci <ci@example.invalid>\nDescription: CI not the pinned Chrome\n' > "$FK/DEBIAN/control"
          printf 'ci\n' > "$FK/opt/google/chrome/ci-not-pinned"
          (cd "$FK" && md5sum opt/google/chrome/ci-not-pinned) > "$FK/DEBIAN/md5sums"
          dpkg-deb --build --root-owner-group "$FK" "$RUNNER_TEMP/fakechrome.deb" > /dev/null
          sudo dpkg -i --force-hold "$RUNNER_TEMP/fakechrome.deb" > /dev/null
          sudo dpkg --triggers-only --pending > /dev/null
          dpkg-query -W -f='${Status} ${Version}\n' google-chrome-stable
          test -z "$(dpkg-query -W -f='${Status}\n' | grep -v '^[a-z]* ok \(installed\|not-installed\|config-files\)$' || true)"
          if cissh "bash $S $P" > "$RUNNER_TEMP/b_fake.out" 2>&1; then cat "$RUNNER_TEMP/b_fake.out"; exit 1; fi
          chk 'REFUSED: installed google-chrome-stable is not the pinned google-chrome-stable_157.0.8103.38-1_arm64.deb (its file sums differ): nothing more is done' "$RUNNER_TEMP/b_fake.out"
          echo STAGE351B_FAKE_CHROME=OK
          echo STAGE351B_CI=PASS

  ops:
    name: stage 6 ops (E6-1..E6-4) local checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: tools (cloud-init schema, sshd, shellcheck)
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloud-init openssh-server > /dev/null
      - name: render user-data with one-time CI keys, cloud-init schema (E6-1, M-S6-02/03/05)
        shell: bash
        run: |
          set -euo pipefail
          ssh-keygen -q -t ed25519 -N '' -C ci-admin -f "$RUNNER_TEMP/ci_admin"
          ssh-keygen -q -t ed25519 -N '' -C ci-deploy -f "$RUNNER_TEMP/ci_deploy"
          ssh-keygen -q -t ed25519 -N '' -C ci-release -f "$RUNNER_TEMP/ci_release"
          python3 -I zavod/ops/server/render_user_data.py --admin-pubkey "$RUNNER_TEMP/ci_admin.pub"             --deploy-pubkey "$RUNNER_TEMP/ci_deploy.pub" --release-signer-pubkey "$RUNNER_TEMP/ci_release.pub" --release-signer-fingerprint "$(ssh-keygen -lf "$RUNNER_TEMP/ci_release.pub" | cut -d' ' -f2)" --repo-id 1412203481             --repo bereznyi-aleksandr/zavod-p1-bot --tenant 48d39de1-2c46-4deb-8557-fec866f2e810 > "$RUNNER_TEMP/user-data.yaml"
          if grep -q 'PRIVATE KEY' "$RUNNER_TEMP/user-data.yaml"; then echo 'private key in user-data'; exit 1; fi
          # M-S6-R5-01: подменённый .pub ключа подписи при отпечатке оператора — отказ, user-data не выводится
          ssh-keygen -q -t ed25519 -N '' -C ci-agent -f "$RUNNER_TEMP/ci_agent"
          if python3 -I zavod/ops/server/render_user_data.py --admin-pubkey "$RUNNER_TEMP/ci_admin.pub" --deploy-pubkey "$RUNNER_TEMP/ci_deploy.pub" --release-signer-pubkey "$RUNNER_TEMP/ci_agent.pub" --release-signer-fingerprint "$(ssh-keygen -lf "$RUNNER_TEMP/ci_release.pub" | cut -d' ' -f2)" --repo-id 1412203481 --repo bereznyi-aleksandr/zavod-p1-bot --tenant 48d39de1-2c46-4deb-8557-fec866f2e810 > "$RUNNER_TEMP/swapped.yaml" 2> "$RUNNER_TEMP/swapped.err"; then echo 'swapped release key accepted'; exit 1; fi
          grep -q 'does not match the operator fingerprint' "$RUNNER_TEMP/swapped.err"
          test ! -s "$RUNNER_TEMP/swapped.yaml"
          echo 'RELEASE_KEY_PIN_CI PASS'
          # M-S6-R7-01: файл совпадает с проверенной сборкой; любая добавка (здесь disable_root false) — отказ
          python3 -I zavod/ops/server/verify_user_data.py "$RUNNER_TEMP/user-data.yaml" | tee "$RUNNER_TEMP/verify.out"
          grep -q '^USERDATA_OK sha256=' "$RUNNER_TEMP/verify.out"
          sed 's/"disable_root": true/"disable_root": false/' "$RUNNER_TEMP/user-data.yaml" > "$RUNNER_TEMP/forged.yaml"
          if python3 -I zavod/ops/server/verify_user_data.py "$RUNNER_TEMP/forged.yaml" > "$RUNNER_TEMP/forged.out"; then echo 'forged user-data accepted'; exit 1; fi
          grep -q '^USERDATA_MISMATCH' "$RUNNER_TEMP/forged.out"
          echo 'USERDATA_PIN_CI PASS'
          cloud-init schema --config-file "$RUNNER_TEMP/user-data.yaml"
      - name: apply the same user-data on the runner through the operator starter (full SHA-256 pin; ufw skipped)
        shell: bash
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/raw"
          mkdir -p "$R/p1" "$R/server"
          cp "$RUNNER_TEMP/user-data.yaml" "$R/p1/user-data.yaml"
          cp zavod/ops/server/apply_user_data.py "$R/server/apply_user_data.py"
          python3 -I zavod/ops/server/render_starter.py --commit "$GITHUB_SHA" --user-data "$R/p1/user-data.yaml" --base "file://$R" --proto =file > "$RUNNER_TEMP/starter.sh"
          cat "$RUNNER_TEMP/starter.sh"
          # M-S6-R8-01: файл, подменённый после проверки, не применяется
          cp "$R/p1/user-data.yaml" "$RUNNER_TEMP/good.yaml"
          printf ' ' >> "$R/p1/user-data.yaml"
          if sudo -E ZAVOD_APPLY_CI_SKIP_FIREWALL=1 sh "$RUNNER_TEMP/starter.sh" > "$RUNNER_TEMP/starter_bad.out" 2>&1; then echo 'tampered user-data applied'; exit 1; fi
          cat "$RUNNER_TEMP/starter_bad.out"
          grep -q 'user-data.yaml: FAILED' "$RUNNER_TEMP/starter_bad.out"
          if id zadmin 2>/dev/null; then echo 'zadmin exists after a refused starter'; exit 1; fi
          cp "$RUNNER_TEMP/good.yaml" "$R/p1/user-data.yaml"
          sudo -E ZAVOD_APPLY_CI_SKIP_FIREWALL=1 sh "$RUNNER_TEMP/starter.sh" | tee "$RUNNER_TEMP/starter.out"
          grep -q '"applied": "apply_user_data v0.2"' "$RUNNER_TEMP/starter.out"
          echo 'STARTER_CI PASS'
          # L-S6-R9-01: disable_root/ssh_pwauth действуют на деле, и программа применения это проверяет
          sudo sshd -T > "$RUNNER_TEMP/sshd_T.out"
          grep -E '^(permitrootlogin|passwordauthentication|kbdinteractiveauthentication|authenticationmethods) ' "$RUNNER_TEMP/sshd_T.out"
          grep -qx 'permitrootlogin no' "$RUNNER_TEMP/sshd_T.out"
          grep -qx 'passwordauthentication no' "$RUNNER_TEMP/sshd_T.out"
          CHECK="import sys; sys.path.insert(0, 'zavod/ops/server'); import apply_user_data as a; a.check_sshd(); print('SSHD_CHECK_OK')"
          sudo python3 -I -c "$CHECK" | grep -qx SSHD_CHECK_OK
          printf 'PermitRootLogin yes\nPasswordAuthentication yes\n' | sudo tee /etc/ssh/sshd_config.d/05-ci-weaker.conf
          if sudo python3 -I -c "$CHECK" > "$RUNNER_TEMP/sshd_bad.out" 2>&1; then echo 'weaker sshd accepted'; exit 1; fi
          cat "$RUNNER_TEMP/sshd_bad.out"
          grep -q 'REFUSED: effective sshd settings' "$RUNNER_TEMP/sshd_bad.out"
          sudo mv /etc/ssh/sshd_config.d/05-ci-weaker.conf "$RUNNER_TEMP/05-ci-weaker.conf.moved"
          sudo python3 -I -c "$CHECK" | grep -qx SSHD_CHECK_OK
          echo 'SSHD_EFFECTIVE_CI PASS'
          sudo sshd -t
          sudo systemctl restart ssh || sudo systemctl restart ssh.socket
      - name: shellcheck and systemd-analyze verify (E6-2, E6-4)
        shell: bash
        run: |
          set -euo pipefail
          shellcheck zavod/ops/server/install_release.sh zavod/ops/deploy_push.sh zavod/ops/ci/e2e_deploy_ci.sh
          test -x /usr/bin/node || sudo ln -s "$(command -v node)" /usr/bin/node
          systemd-analyze verify --man=no zavod/ops/server/zavod-p1.service zavod/ops/server/zavod-p1-watch.service \
            zavod/ops/server/zavod-kernel.service
      - name: real permission schema and deploy as zavod end to end (E6-2, M-S6-02/03, M-S6-R2-01/02)
        shell: bash
        run: |
          set -o pipefail
          bash zavod/ops/ci/e2e_deploy_ci.sh "$RUNNER_TEMP/ci_deploy" "$RUNNER_TEMP/ci_admin" 1412203481             bereznyi-aleksandr/zavod-p1-bot 48d39de1-2c46-4deb-8557-fec866f2e810 "$RUNNER_TEMP/ci_release" | tee "$RUNNER_TEMP/e2e.out"
          test "$(grep -c '^CHECK .* PASS$' "$RUNNER_TEMP/e2e.out")" -eq 15
          grep -q '^E2E_DEPLOY_CI PASS head=' "$RUNNER_TEMP/e2e.out"
      - name: ops unit tests (E6-1..E6-4), no skips
        shell: bash
        env:
          ZAVOD_OPS_SSHD: '1'
        run: |
          set -o pipefail
          command -v pwsh
          python3 -I -m unittest discover -s zavod/ops/tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/ops_tests.out"
          grep -q '^Ran 64 tests' "$RUNNER_TEMP/ops_tests.out"
          grep -q '^OK$' "$RUNNER_TEMP/ops_tests.out"
          node zavod/kernel/ci/leak_scan.mjs zavod/ops
