# ДОКУМЕНТ: .github/workflows/zavod-kernel.yml
# ВЕРСИЯ: v0.6
# СТАТУС: CANDIDATE
# ДАТА СОЗДАНИЯ: 2026-10-07 13:35 +03:00
# ДАТА ОБНОВЛЕНИЯ: 2026-10-09 07:50 +03:00 (v0.6: этап 5 — самопроверка приёмки P1 (заглушка Bot API,
#   плохой бот обязан не пройти); v0.5: E4-8 — единица «контейнер»: ZAVOD_CONTAINER_IMAGE — тот же
#   закреплённый образ, что у сервера; v0.4: слияние — закрепления L-E35-01 этапа 3 и задание
#   jobobject этапа 4; v0.3 (этап 3): аудит E3-5 L-E35-01 — действия по SHA коммита, образ PostgreSQL по
#   digest, Node точной версией, psql из того же образа; v0.3 (этап 4): задание jobobject на windows-latest —
#   сборка win/zavod_jobhost.exe и тест единицы Job Object; v0.2: аудит Z5 M-Z5-01 — корневая cgroup v2
#   Завода для ограждения единиц исполнения; ZAVOD_CGROUP_ROOT)
# ИСПОЛНИТЕЛЬ: Claude (сессия fd43469f-418c-4f8b-b94b-32cc0b8d4acf)
# НАЗНАЧЕНИЕ: Завод, этап 3 — Kernel на чистом PostgreSQL 16, три независимых прогона
#   (критерий E3-2: три прогона подряд зелёные). Каждый прогон — свой одноразовый контейнер.
# ОГРАНИЧЕНИЯ: секретов не использует; права только на чтение; платных маршрутов нет.
name: Zavod Kernel

on:
  push:
    branches: [main, 'zavod/**']
    paths: ['zavod/**', 'bem954/H1_31_PACKAGE_R51/**', '.github/workflows/zavod-kernel.yml']
  pull_request:
    paths: ['zavod/**', 'bem954/H1_31_PACKAGE_R51/**', '.github/workflows/zavod-kernel.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zavod-kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  PKG: bem954/H1_31_PACKAGE_R51

jobs:
  kernel:
    name: kernel (run ${{ matrix.run }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    services:
      postgres:
        image: postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      ZAVOD_CGROUP_ROOT: /sys/fs/cgroup/zavod
      # Клиент psql/pg_dump/pg_restore/createdb — из того же образа, что и сервер (L-E35-01).
      ZAVOD_PG_IMAGE: postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
      # Единица «контейнер» (E4-8): образ с glibc; node и код Kernel подключаются только на чтение.
      ZAVOD_CONTAINER_IMAGE: postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
      - name: pinned PostgreSQL client (same image digest as the server)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pgbin"
          for t in psql pg_dump pg_restore createdb; do
            printf '#!/usr/bin/env bash\nexec docker run --rm -i --network host -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$PWD" "$ZAVOD_PG_IMAGE" %s "$@"\n' "$t" > "$RUNNER_TEMP/pgbin/$t"
            chmod +x "$RUNNER_TEMP/pgbin/$t"
          done
          echo "$RUNNER_TEMP/pgbin" >> "$GITHUB_PATH"
          PATH="$RUNNER_TEMP/pgbin:$PATH" psql --version | tee /dev/stderr | grep -q 'PostgreSQL) 16\.'
      - name: workflow pins (L-E35-01)
        run: node zavod/kernel/ci/workflow_pins.mjs .github/workflows/zavod-kernel.yml
      - name: cgroup v2 unit root (M-Z5-01)
        run: |
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          sudo mkdir -p "$ZAVOD_CGROUP_ROOT"
          cat "$ZAVOD_CGROUP_ROOT/cgroup.procs" >/dev/null
          command -v setpriv
      - name: Kernel CI (H1.31 install, SR-08, SR-02, tests, SR-09)
        shell: bash
        working-directory: zavod/kernel
        run: |
          set -o pipefail
          bash ci/kernel_ci.sh "$GITHUB_WORKSPACE/$PKG" "$RUNNER_TEMP/kernel" | tee "$RUNNER_TEMP/kernel_transcript.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: zavod-kernel-run-${{ matrix.run }}
          path: |
            ${{ runner.temp }}/kernel_transcript.log
            ${{ runner.temp }}/kernel/tests.out
          if-no-files-found: ignore

  jobobject:
    name: windows job object unit
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
      - name: Job Object unit (Windows; M-Z5-01, раздел 18)
        shell: bash
        working-directory: zavod/kernel
        env:
          CI: 'true'
        run: |
          set -o pipefail
          npm ci --ignore-scripts
          bash win/build_jobhost.sh
          node --test tests/jobhost.test.mjs | tee "$RUNNER_TEMP/jobhost.out"
          grep -q '^# pass 2$' "$RUNNER_TEMP/jobhost.out" && grep -q '^# skipped 0$' "$RUNNER_TEMP/jobhost.out"
          echo "ZAVOD_JOBOBJECT_TEST_RAN=2"

  catalog_p1:
    name: catalog P1 acceptance selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
      - name: P1 acceptance harness selftest (E5-4)
        shell: bash
        run: |
          set -o pipefail
          node --test zavod/catalog/P1_telegram_bot/acceptance/selftest/ | tee "$RUNNER_TEMP/p1_selftest.out"
          grep -q '^# pass 2$' "$RUNNER_TEMP/p1_selftest.out" && grep -q '^# fail 0$' "$RUNNER_TEMP/p1_selftest.out"
