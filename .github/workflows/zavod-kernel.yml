          grep -q '^CODEX_CLI=OK .* version="[a-z-]* 0\.166\.0"' "$RUNNER_TEMP/b_first.out"
          grep -q '^CHROME=OK version="Google Chrome 157\.0\.8103\.38.* hold=yes update_source=none setuid=/opt/google/chrome/chrome-sandbox ' "$RUNNER_TEMP/b_first.out"
