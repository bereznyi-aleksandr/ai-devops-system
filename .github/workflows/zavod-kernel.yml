          cat "$RUNNER_TEMP/b_kill.out"; tail -n 20 "$RUNNER_TEMP/b_break.out"
          grep -q '^KILLED_AT=' "$RUNNER_TEMP/b_kill.out"
          test "$(grep -c '^DOWNLOAD=OK ' "$RUNNER_TEMP/b_break.out")" = 3
          test "$(grep -c '^TOOL_UNPACKED=' "$RUNNER_TEMP/b_break.out")" = 2
