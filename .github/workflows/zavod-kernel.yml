          command -v shellcheck > /dev/null || { sudo apt-get update -qq; sudo apt-get install -y -qq shellcheck > /dev/null; }
          shellcheck -S warning "$V/install_stage_3_5_1b.sh"
          python3 -I -c 'import sys; compile(open(sys.argv[1], "rb").read(), sys.argv[1], "exec")' "$V/tools_tar_3_5_1b.py"
          # команда оператора 3.5.1б — та же строка, что у 3.5.1 (принята ChatGPT R6), кроме имени установщика
          test "$(tail -n 1 $V/operator_command_3_5_1.txt | sed 's|/install_stage_3_5_1\.sh"|/X"|')" = \
               "$(tail -n 1 $V/operator_command_3_5_1b.txt | sed 's|/install_stage_3_5_1b\.sh"|/X"|')"
          # на машине GitHub Chrome не должно быть заранее, иначе проба установки ничего не доказывает
          if dpkg-query -W -f='${Status}' google-chrome-stable 2> /dev/null | grep -q 'install ok installed'; then echo 'runner already has Chrome'; exit 1; fi
