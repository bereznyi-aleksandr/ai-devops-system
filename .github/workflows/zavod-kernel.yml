          cissh "$(opcmd)" | tee "$RUNNER_TEMP/b_first.out"
          test "$(grep -c '^DOWNLOAD_REUSED=' "$RUNNER_TEMP/b_first.out")" = 3
          test "$(grep -c '^TOOL_REUSED=' "$RUNNER_TEMP/b_first.out")" = 2
          grep -q ' resume=yes$' "$RUNNER_TEMP/b_first.out"
          grep '^DPKG_UNFINISHED=' "$RUNNER_TEMP/b_first.out"
          grep -q '^CHROME_APT_CLOSED=/var/lib/zavod-install-3.5.1b/chrome-apt-closed-' "$RUNNER_TEMP/b_first.out"
          sudo test ! -e /var/lib/zavod-install-3.5.1b/chrome-apt-open.txt
          grep -q '^CHROME_RESUMED=157.0.8103.38-1 (unfinished install finished; ' "$RUNNER_TEMP/b_first.out"
          grep -qx ZAVOD_3_5_1B=OK "$RUNNER_TEMP/b_first.out"
          grep -q "^CHROME_FILES=OK FILES=[1-9][0-9]* (each file of " "$RUNNER_TEMP/b_first.out"
          test -z "$(dpkg-query -W -f='${Status}\n' | grep -v '^[a-z]* ok \(installed\|not-installed\|config-files\)$' || true)"
