      - name: stage 3.5.1b on Arm64 - Claude CLI, Codex CLI, Chrome (pinned files, operator command, repeat, refusals)
        if: matrix.arch == 'arm64'
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
