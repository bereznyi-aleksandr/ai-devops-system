  cell:
    name: Linux cell installer, session start and refusals (3.3.8), archive intake (3.3.9)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
      - name: PostgreSQL 16 of the runner image with the bem chain (H1.31, Z-EXT-01..04, final check)
        shell: bash
        run: |
          set -euo pipefail
          CONF=/etc/postgresql/16/main
          sudo systemctl start postgresql.service
          # Только на время установки цепочки: вход trust через сокет (одноразовая машина CI), потом строка убирается.
          sudo sed -i '1i local all all trust # zavod-ci-chain' "$CONF/pg_hba.conf"
          sudo systemctl reload postgresql.service
          PKG="$RUNNER_TEMP/pkg"
          K="$GITHUB_WORKSPACE/zavod/kernel"
          mkdir -p "$PKG"
          cp -R bem954/H1_31_PACKAGE_R51/. "$PKG/"
          cd "$PKG"
          psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -f 00_cluster_bootstrap.sql > chain_00.out
          node run_migration.mjs --files 01_database_migration.sql > chain_wrapper.out
          node "$K/db/build_ext.mjs" 01_database_migration.sql --check
          psql -X -v ON_ERROR_STOP=1 -U postgres -d bem -f "$K/db/02_zavod_ext_01.sql" > chain_ext.out
          for f in 03_zavod_ext_02 04_zavod_ext_03 06_zavod_ext_04 07_zavod_ext_05; do
            psql -X -v ON_ERROR_STOP=1 --single-transaction -U postgres -d bem -f "$K/db/$f.sql" > "chain_$f.out"
          done
          node "$K/db/build_final_ext.mjs" 05_final_state_check.sql --check
          psql -X -v ON_ERROR_STOP=1 --single-transaction -U postgres -d bem -f "$K/db/05_final_state_check_ext01.sql" > chain_final.out
          sudo sed -i '/# zavod-ci-chain$/d' "$CONF/pg_hba.conf"
          sudo systemctl reload postgresql.service
          echo CELL_DB_CHAIN=OK
      - name: install the cell twice (same result), shellcheck, python syntax
        shell: bash
        run: |
          set -euo pipefail
          C=zavod/ops/server/cell
          command -v nft >/dev/null || sudo apt-get install -y -qq nftables > /dev/null
          shellcheck -S warning "$C/install_cell.sh" "$C/cell_ci.sh" "$C/zagent-session" "$C/intake_ci.sh" "$C/egress_ci.sh"
          for f in zagent-start zavod_intake.py intake_gen.py zavod-alert-notify zavod-alert-telegram zavod-gate zavod-proxy \
                   egress_session_probe.py test_zavod_gate.py; do
            python3 -I -c 'import ast, sys; ast.parse(open(sys.argv[1], encoding="utf-8").read())' "$C/$f"
          done
          # -B: тест не пишет *.pyc рядом с файлами ячейки — проверка склейки считает его непроверяемым форматом
          # (аудит M3310-R11-03); переменная PYTHONDONTWRITEBYTECODE при -I не действует
          python3 -I -B "$C/test_zavod_gate.py" | tee "$RUNNER_TEMP/gate_unit.out"
          grep -qx ZAVOD_GATE_UNIT=PASS "$RUNNER_TEMP/gate_unit.out"
          PGC=/etc/postgresql/16/main
          # аудит ChatGPT M-351-R2-01: файлы пакета pg_hba/pg_ident не меняются (содержимое, inode, время записи)
          pgpkg() { sudo stat -c '%n %i %.9Y %s' "$PGC/pg_hba.conf" "$PGC/pg_ident.conf"; sudo sha256sum "$PGC/pg_hba.conf" "$PGC/pg_ident.conf"; }
          pgpkg > "$RUNNER_TEMP/pgpkg0.txt"
          # опись поставленного: путь, inode, время записи и изменения свойств (ctime), размер, владелец, права, сумма
          snap() {
            sudo find /usr/local/lib/zavod /etc/zavod /etc/postgresql/16/main /etc/tmpfiles.d/zavod-cell.conf \
              /etc/polkit-1/rules.d/50-zavod-no-units.rules -xdev \( -type f -o -type d \) \
              -printf '%p %i %T@ %C@ %s %u:%g %m\n' 2> /dev/null | sort
            sudo find /etc/systemd/system -maxdepth 1 -type f -printf '%p %i %T@ %C@ %s %u:%g %m\n' | sort
            sudo find /usr/local/lib/zavod /etc/zavod /etc/postgresql/16/main -type f -exec sha256sum {} + | sort
          }
          sudo bash "$C/install_cell.sh" --pg-conf-dir /etc/postgresql/16/main --session-fs-size 64M --intake-fs-size 192M --intake-fs-inodes 2048 --intake-journal-size 16M --min-free 1G | tee "$RUNNER_TEMP/install1.out"
          grep -qx ZAVOD_CELL_INSTALL=OK "$RUNNER_TEMP/install1.out"
          grep -qx 'PG_FILE /etc/zavod/pg/pg_hba.conf installed new' "$RUNNER_TEMP/install1.out"
          snap > "$RUNNER_TEMP/snap1.txt"
          sleep 1
          sudo bash "$C/install_cell.sh" --pg-conf-dir /etc/postgresql/16/main --session-fs-size 64M --intake-fs-size 192M --intake-fs-inodes 2048 --intake-journal-size 16M --min-free 1G | tee "$RUNNER_TEMP/install2.out"
          grep -qx ZAVOD_CELL_INSTALL=OK "$RUNNER_TEMP/install2.out"
          grep -qx 'PG_FILE /etc/zavod/pg/pg_hba.conf verified unchanged' "$RUNNER_TEMP/install2.out"
          snap > "$RUNNER_TEMP/snap2.txt"
          diff "$RUNNER_TEMP/snap1.txt" "$RUNNER_TEMP/snap2.txt"
          test "$(wc -l < "$RUNNER_TEMP/snap1.txt")" -gt 40
          echo CELL_REPEAT_NO_WRITE=OK
          diff "$RUNNER_TEMP/pgpkg0.txt" <(pgpkg)
          if sudo grep -q 'zavod_' "$PGC/pg_hba.conf" "$PGC/pg_ident.conf"; then exit 1; fi
          test "$(sudo grep -c 'map=zavod_cell' /etc/zavod/pg/pg_hba.conf)" = 1
          test "$(sudo grep -c '^zavod_cell' /etc/zavod/pg/pg_ident.conf)" = 1
          test "$(sudo -u postgres psql -XAtc 'show hba_file')" = /etc/zavod/pg/pg_hba.conf
          echo CELL_PG_PACKAGE_FILES_UNCHANGED=OK
          # аудит ChatGPT L-351-R3-01: лишний перевод строки в конце /etc/zavod/pg/pg_hba.conf — повтор отказывает
          # (сравнение побайтное); после возврата прежних байтов повтор снова OK
          sudo cp -p /etc/zavod/pg/pg_hba.conf "$RUNNER_TEMP/keep_zpg_hba.conf"
          printf '\n' | sudo tee -a /etc/zavod/pg/pg_hba.conf > /dev/null
          if sudo bash "$C/install_cell.sh" --pg-conf-dir /etc/postgresql/16/main --session-fs-size 64M --intake-fs-size 192M --intake-fs-inodes 2048 --intake-journal-size 16M --min-free 1G > "$RUNNER_TEMP/install_nl.out" 2>&1; then cat "$RUNNER_TEMP/install_nl.out"; exit 1; fi
          grep -q 'REFUSED: /etc/zavod/pg/pg_hba.conf exists and differs' "$RUNNER_TEMP/install_nl.out" || { cat "$RUNNER_TEMP/install_nl.out"; exit 1; }
          sudo cp -p "$RUNNER_TEMP/keep_zpg_hba.conf" /etc/zavod/pg/pg_hba.conf
          sudo bash "$C/install_cell.sh" --pg-conf-dir /etc/postgresql/16/main --session-fs-size 64M --intake-fs-size 192M --intake-fs-inodes 2048 --intake-journal-size 16M --min-free 1G > "$RUNNER_TEMP/install3.out" 2>&1 || { cat "$RUNNER_TEMP/install3.out"; exit 1; }
          grep -qx 'PG_FILE /etc/zavod/pg/pg_hba.conf verified unchanged' "$RUNNER_TEMP/install3.out"
          echo CELL_PG_FILE_BYTES=OK
      - name: query concatenation check, build fails on a probe (3.3.10.2, SQL_CONCAT_SCAN=PASS)
        shell: bash
        run: |
          set -euo pipefail
          S=zavod/kernel/ci/sql_concat_scan.py
          # аудит M3311-R1-03: и файлы пакета сервера — установщик, сборщик, службы ядра и движка
          V=zavod/ops/server
          TREE="zavod/kernel/src zavod/kernel/cli zavod/engine/src $V/cell $V/install_server.sh $V/build_server_package.py
            $V/zavod-engine.service $V/zavod-kernel.service $V/verify_tree.py $V/install_stage_3_5_1.sh $V/install_stage_3_5_1b.sh"
          # shellcheck disable=SC2086
          python3 -I "$S" --allow zavod/kernel/ci/sql_concat_allow.txt $TREE | tee "$RUNNER_TEMP/scan.out"
          grep -qx SQL_CONCAT_SCAN=PASS "$RUNNER_TEMP/scan.out"
          # внешний текст как команда в установщике ловится и со списком разрешений (и сумма PIN не сходится)
          printf '%s\n' 'bash -c "$EXTERNAL_TEXT"' >> "$V/install_server.sh"
          n=$(wc -l < "$V/install_server.sh")
          # shellcheck disable=SC2086
          if python3 -I "$S" --allow zavod/kernel/ci/sql_concat_allow.txt $TREE > "$RUNNER_TEMP/scan_srv_probe.out"; then exit 1; fi
          git checkout -- "$V/install_server.sh"
          grep -q "^SQL_CONCAT $V/install_server.sh:$n: SH_DYN_C: " "$RUNNER_TEMP/scan_srv_probe.out"
          grep -q "^SQL_CONCAT $V/install_server.sh:0: PIN: file that starts programs is changed" "$RUNNER_TEMP/scan_srv_probe.out"
          echo SERVER_SCAN_PROBE=OK
          grep -q '^SQL_CONCAT_JS_PARSER=acorn ' "$RUNNER_TEMP/scan.out"
          if python3 -I "$S" zavod/kernel/ci/sql_concat_probe > "$RUNNER_TEMP/scan_probe.out"; then echo 'probe passed the scan'; exit 1; fi
          grep -qx 'SQL_CONCAT_SCAN files=53 findings=418' "$RUNNER_TEMP/scan_probe.out"
          # каждый случай пробы пойман на своём месте (аудит M3310-R1B-02: +=, промежуточная переменная, куски, .join, JS; M3310-R2-01: массив и .join в JS, текст из функции, параметра, обёртки; M3310-R3-01: db['query'], ?.(), bind, call, деструктуризация, имя в строке, куски имени, eval; M3310-R4-01: экранирование имени, вызов по вычисляемому имени, перенос метода, Reflect, Proxy, прототип, разбор и цикл в свойство, import(); M3310-R5-01: переназначенная и затенённая таблица; M3310-R5-02: «+» после переноса строки, затенённая константа; M3310-R5-03: constructor, код в строке, нижний слой драйвера, Object.values, node -e, psql, vm, смена прототипа через запись по ключу; M3310-R6-01: изменённый список ключей — запись в элемент, push, передача в функцию; M3310-R6-02: process.getBuiltinModule; M3310-R6-03: exec/execSync, весь модуль, promisify, shell: true, -e из кусков, «node -e» одной строкой, импорт child_process вне списка файлов, sh -c с не постоянным сценарием, node без файла, NODE_OPTIONS, программа не из списка, оболочка со входа; подмена Object.freeze; M3310-R7-01: список, изменённый через обратный вызов, thisArg, метод с this, push.call; M3310-R7-02: sh -c 'eval "$1"', «. "$1"», та же строка через свою обёртку run, программа из параметра; M3310-R7-03: сценарии оболочки — psql -c из подстановки, помощник с текстом из подстановок, eval, программа из подстановки, heredoc с подстановкой, :x и \gexec, python -c, node -e, труба в psql, sh -c 'eval', psql -f; M3310-R8-01: подмена Object.freeze через другое имя, globalThis, разбор, передача Array, запись в замороженный список; M3310-R8-02: sh -c 'python3 -c …', docker … sh -ec, python3 в списке, оболочка со сценарием не из списка; M3310-R8-03: select в нижнем регистре в .execute, executemany и psql с текстом из параметра, eval, getattr)
          for at in bad_gate.py:4 bad_gate.py:5 bad_gate.py:6 bad_gate.py:7 bad_kernel.mjs:4 bad_kernel.mjs:5 \
                    bad_flow.py:8 bad_flow.py:15 bad_flow.py:16 bad_flow.py:21 bad_flow.py:26 bad_flow.mjs:6 \
                    bad_flow.mjs:12 bad_flow.mjs:15 bad_flow.mjs:19 bad_flow2.mjs:5 bad_flow2.mjs:6 \
                    bad_flow2.mjs:12 bad_flow2.mjs:15 bad_flow2.mjs:20 bad_flow2.py:11 bad_flow2.py:16 \
                    bad_flow3.mjs:8 bad_flow3.mjs:11 bad_flow3.mjs:14 bad_flow3.mjs:18 bad_flow3.mjs:19 \
                    bad_flow3.mjs:22 bad_flow3.mjs:25 bad_flow3.mjs:26 bad_flow3.mjs:29 bad_flow3.mjs:32 \
                    bad_flow4.mjs:8 bad_flow4.mjs:11 bad_flow4.mjs:14 bad_flow4.mjs:15 bad_flow4.mjs:16 bad_flow4.mjs:19 \
                    bad_flow4.mjs:22 bad_flow4.mjs:26 bad_flow4.mjs:30 bad_flow4.mjs:34 bad_flow4.mjs:38 bad_flow4.mjs:41 \
