# ОГРАНИЧЕНИЯ: секретов не использует; права только на чтение; платных маршрутов нет.
name: Zavod Kernel

on:
  push:
    branches: [main, 'zavod/**']
    paths: ['zavod/**', 'bem954/H1_31_PACKAGE_R51/**', '.github/workflows/zavod-kernel.yml']
  pull_request:
    paths: ['zavod/**', 'bem954/H1_31_PACKAGE_R51/**', '.github/workflows/zavod-kernel.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zavod-kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  PKG: bem954/H1_31_PACKAGE_R51

jobs:
  kernel:
    name: kernel (run ${{ matrix.run }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    services:
      postgres:
        image: postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      ZAVOD_CGROUP_ROOT: /sys/fs/cgroup/zavod
      # Клиент psql/pg_dump/pg_restore/createdb — из того же образа, что и сервер (L-E35-01).
      ZAVOD_PG_IMAGE: postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
      # Единица «контейнер» (E4-8): образ с glibc; node и код Kernel подключаются только на чтение.
      ZAVOD_CONTAINER_IMAGE: postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
      - name: pinned PostgreSQL client (same image digest as the server)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pgbin"
          for t in psql pg_dump pg_restore createdb; do
            printf '#!/usr/bin/env bash\nexec docker run --rm -i --network host -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$PWD" "$ZAVOD_PG_IMAGE" %s "$@"\n' "$t" > "$RUNNER_TEMP/pgbin/$t"
            chmod +x "$RUNNER_TEMP/pgbin/$t"
          done
          echo "$RUNNER_TEMP/pgbin" >> "$GITHUB_PATH"
          PATH="$RUNNER_TEMP/pgbin:$PATH" psql --version | tee /dev/stderr | grep -q 'PostgreSQL) 16\.'
      - name: workflow pins (L-E35-01)
        run: node zavod/kernel/ci/workflow_pins.mjs .github/workflows/zavod-kernel.yml
      - name: cgroup v2 unit root (M-Z5-01)
        run: |
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          sudo mkdir -p "$ZAVOD_CGROUP_ROOT"
          cat "$ZAVOD_CGROUP_ROOT/cgroup.procs" >/dev/null
          command -v setpriv
      - name: Kernel CI (H1.31 install, SR-08, SR-02, tests, SR-09)
        shell: bash
        working-directory: zavod/kernel
        run: |
          set -o pipefail
          bash ci/kernel_ci.sh "$GITHUB_WORKSPACE/$PKG" "$RUNNER_TEMP/kernel" | tee "$RUNNER_TEMP/kernel_transcript.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: zavod-kernel-run-${{ matrix.run }}
          path: |
            ${{ runner.temp }}/kernel_transcript.log
            ${{ runner.temp }}/kernel/tests.out
            ${{ runner.temp }}/kernel/e55_injection_journal.jsonl
            ${{ runner.temp }}/kernel/e55_injection_journal.jsonl.sha256
          if-no-files-found: ignore

  jobobject:
    name: windows job object (PG16 + full fencer)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PGHOST: 127.0.0.1
      PGPORT: '54316'
      PGUSER: postgres
      # M-E46-03: PostgreSQL 16 для Windows — архив EDB; сумма SHA-256 закреплена (та же сборка 16.15-5,
      # что на локальном стенде проекта). Несовпадение суммы — отказ до распаковки.
      ZAVOD_PG_WIN_URL: https://get.enterprisedb.com/postgresql/postgresql-16.15-5-windows-x64-binaries.zip
      ZAVOD_PG_WIN_SHA256: 43bb45f173a6f08cf1d29a97a6d8deb119e8e8093a24c00d2d1001a0ccaa8281
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
      - name: PostgreSQL 16 (pinned EDB binaries, SHA-256), trust only on 127.0.0.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $zip = Join-Path $env:RUNNER_TEMP 'pg16.zip'
          Invoke-WebRequest -Uri $env:ZAVOD_PG_WIN_URL -OutFile $zip
          $h = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($h -ne $env:ZAVOD_PG_WIN_SHA256) { throw "PG16_ZIP_SHA256_MISMATCH got $h" }
          $root = Join-Path $env:RUNNER_TEMP 'pg16'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          tar -xf $zip -C $root
          if ($LASTEXITCODE) { throw 'unpack' }
          $bin = Join-Path $root 'pgsql\bin'
          $data = Join-Path $env:RUNNER_TEMP 'pg16data'
          & "$bin\initdb.exe" -D $data -U postgres -A trust -E UTF8 --locale=C
          if ($LASTEXITCODE) { throw 'initdb' }
          $log = Join-Path $env:RUNNER_TEMP 'pg16.log'
          & "$bin\pg_ctl.exe" -D $data -l $log -o "-p $env:PGPORT -c listen_addresses=127.0.0.1" -w start
          if ($LASTEXITCODE) { Get-Content $log; throw 'pg_ctl start' }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - name: Job Object — full fencer scenario on H1.31 + Z-EXT-01 (M-E46-03, M-Z5-01)
        shell: bash
        working-directory: zavod/kernel
        env:
          CI: 'true'
        run: |
          set -o pipefail
          psql --version
          psql --version | grep -q 'PostgreSQL) 16\.'
          bash ci/windows_fencer_ci.sh "$GITHUB_WORKSPACE/$PKG" "$RUNNER_TEMP/winfencer" | tee "$RUNNER_TEMP/win_fencer_transcript.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: zavod-kernel-windows-jobobject
          path: |
            ${{ runner.temp }}/win_fencer_transcript.log
            ${{ runner.temp }}/winfencer/win_fencer_tests.out
            ${{ runner.temp }}/pg16.log
          if-no-files-found: ignore

  catalog_p1:
    name: catalog P1 acceptance and product scanner selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
      - name: P1 acceptance harness selftest (E5-4)
        shell: bash
        run: |
          set -o pipefail
          node --test zavod/catalog/P1_telegram_bot/acceptance/selftest/selftest.test.mjs | tee "$RUNNER_TEMP/p1_selftest.out"
          grep -q '^# pass 3$' "$RUNNER_TEMP/p1_selftest.out" && grep -q '^# fail 0$' "$RUNNER_TEMP/p1_selftest.out"
      - name: product scanner selftest (E5-6) and SR-02 over zavod/catalog
        shell: bash
        run: |
          set -o pipefail
          node --test zavod/catalog/ci/product_scan.test.mjs | tee "$RUNNER_TEMP/pscan_selftest.out"
          grep -q '^# pass 12$' "$RUNNER_TEMP/pscan_selftest.out" && grep -q '^# fail 0$' "$RUNNER_TEMP/pscan_selftest.out"
          node zavod/kernel/ci/leak_scan.mjs zavod/catalog

  kernel_socket:
    name: kernel connects to PostgreSQL 16 through the Linux socket (3.3.2.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
      - name: PostgreSQL 16 of the runner image, socket only, peer login for the runner user
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          sudo -u postgres psql -Atc 'select version()' | grep -q 'PostgreSQL 16'
          sudo -u postgres createuser "$(id -un)"
          sudo -u postgres createdb -O "$(id -un)" bem
      - name: socket check (KERNEL_SOCKET=PASS)
        shell: bash
        working-directory: zavod/kernel
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-fund > "$RUNNER_TEMP/npm_ci_socket.out"
          env -u PGHOST node ci/socket_check.mjs | tee "$RUNNER_TEMP/socket_check.out"
          grep -q '^KERNEL_SOCKET=PASS$' "$RUNNER_TEMP/socket_check.out"

  cell:
    name: Linux cell installer, session start and refusals (3.3.8), archive intake (3.3.9)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
      - name: PostgreSQL 16 of the runner image with the bem chain (H1.31, Z-EXT-01..04, final check)
        shell: bash
        run: |
          set -euo pipefail
          CONF=/etc/postgresql/16/main
          sudo systemctl start postgresql.service
          # Только на время установки цепочки: вход trust через сокет (одноразовая машина CI), потом строка убирается.
          sudo sed -i '1i local all all trust # zavod-ci-chain' "$CONF/pg_hba.conf"
          sudo systemctl reload postgresql.service
          PKG="$RUNNER_TEMP/pkg"
          K="$GITHUB_WORKSPACE/zavod/kernel"
          mkdir -p "$PKG"
          cp -R bem954/H1_31_PACKAGE_R51/. "$PKG/"
          cd "$PKG"
          psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -f 00_cluster_bootstrap.sql > chain_00.out
          node run_migration.mjs --files 01_database_migration.sql > chain_wrapper.out
          node "$K/db/build_ext.mjs" 01_database_migration.sql --check
          psql -X -v ON_ERROR_STOP=1 -U postgres -d bem -f "$K/db/02_zavod_ext_01.sql" > chain_ext.out
          for f in 03_zavod_ext_02 04_zavod_ext_03 06_zavod_ext_04 07_zavod_ext_05; do
            psql -X -v ON_ERROR_STOP=1 --single-transaction -U postgres -d bem -f "$K/db/$f.sql" > "chain_$f.out"
          done
          node "$K/db/build_final_ext.mjs" 05_final_state_check.sql --check
          psql -X -v ON_ERROR_STOP=1 --single-transaction -U postgres -d bem -f "$K/db/05_final_state_check_ext01.sql" > chain_final.out
          sudo sed -i '/# zavod-ci-chain$/d' "$CONF/pg_hba.conf"
          sudo systemctl reload postgresql.service
          echo CELL_DB_CHAIN=OK
      - name: install the cell twice (same result), shellcheck, python syntax
        shell: bash
        run: |
          set -euo pipefail
          C=zavod/ops/server/cell
          command -v nft >/dev/null || sudo apt-get install -y -qq nftables > /dev/null
          shellcheck -S warning "$C/install_cell.sh" "$C/cell_ci.sh" "$C/zagent-session" "$C/intake_ci.sh" "$C/egress_ci.sh"
          for f in zagent-start zavod_intake.py intake_gen.py zavod-alert-notify zavod-alert-telegram zavod-gate zavod-proxy \
                   egress_session_probe.py test_zavod_gate.py; do
            python3 -I -c 'import ast, sys; ast.parse(open(sys.argv[1], encoding="utf-8").read())' "$C/$f"
          done
          # -B: тест не пишет *.pyc рядом с файлами ячейки — проверка склейки считает его непроверяемым форматом
          # (аудит M3310-R11-03); переменная PYTHONDONTWRITEBYTECODE при -I не действует
          python3 -I -B "$C/test_zavod_gate.py" | tee "$RUNNER_TEMP/gate_unit.out"
          grep -qx ZAVOD_GATE_UNIT=PASS "$RUNNER_TEMP/gate_unit.out"
          sudo bash "$C/install_cell.sh" --pg-conf-dir /etc/postgresql/16/main --session-fs-size 64M --intake-fs-size 192M --intake-fs-inodes 2048 --intake-journal-size 16M --min-free 1G | tee "$RUNNER_TEMP/install1.out"
          grep -qx ZAVOD_CELL_INSTALL=OK "$RUNNER_TEMP/install1.out"
          sudo bash "$C/install_cell.sh" --pg-conf-dir /etc/postgresql/16/main --session-fs-size 64M --intake-fs-size 192M --intake-fs-inodes 2048 --intake-journal-size 16M --min-free 1G | tee "$RUNNER_TEMP/install2.out"
          grep -qx ZAVOD_CELL_INSTALL=OK "$RUNNER_TEMP/install2.out"
          test "$(sudo grep -c 'map=zavod_cell' /etc/postgresql/16/main/pg_hba.conf)" = 1
          test "$(sudo grep -c '^zavod_cell' /etc/postgresql/16/main/pg_ident.conf)" = 1
      - name: query concatenation check, build fails on a probe (3.3.10.2, SQL_CONCAT_SCAN=PASS)
        shell: bash
        run: |
          set -euo pipefail
          S=zavod/kernel/ci/sql_concat_scan.py
          # аудит M3311-R1-03: и файлы пакета сервера — установщик, сборщик, службы ядра и движка
          V=zavod/ops/server
          TREE="zavod/kernel/src zavod/kernel/cli zavod/engine/src $V/cell $V/install_server.sh $V/build_server_package.py
            $V/zavod-engine.service $V/zavod-kernel.service $V/verify_tree.py $V/install_stage_3_5_1.sh"
          # shellcheck disable=SC2086
          python3 -I "$S" --allow zavod/kernel/ci/sql_concat_allow.txt $TREE | tee "$RUNNER_TEMP/scan.out"
          grep -qx SQL_CONCAT_SCAN=PASS "$RUNNER_TEMP/scan.out"
          # внешний текст как команда в установщике ловится и со списком разрешений (и сумма PIN не сходится)
          printf '%s\n' 'bash -c "$EXTERNAL_TEXT"' >> "$V/install_server.sh"
          n=$(wc -l < "$V/install_server.sh")
          # shellcheck disable=SC2086
          if python3 -I "$S" --allow zavod/kernel/ci/sql_concat_allow.txt $TREE > "$RUNNER_TEMP/scan_srv_probe.out"; then exit 1; fi
          git checkout -- "$V/install_server.sh"
          grep -q "^SQL_CONCAT $V/install_server.sh:$n: SH_DYN_C: " "$RUNNER_TEMP/scan_srv_probe.out"
          grep -q "^SQL_CONCAT $V/install_server.sh:0: PIN: file that starts programs is changed" "$RUNNER_TEMP/scan_srv_probe.out"
          echo SERVER_SCAN_PROBE=OK
          grep -q '^SQL_CONCAT_JS_PARSER=acorn ' "$RUNNER_TEMP/scan.out"
          if python3 -I "$S" zavod/kernel/ci/sql_concat_probe > "$RUNNER_TEMP/scan_probe.out"; then echo 'probe passed the scan'; exit 1; fi
          grep -qx 'SQL_CONCAT_SCAN files=51 findings=413' "$RUNNER_TEMP/scan_probe.out"
          # каждый случай пробы пойман на своём месте (аудит M3310-R1B-02: +=, промежуточная переменная, куски, .join, JS; M3310-R2-01: массив и .join в JS, текст из функции, параметра, обёртки; M3310-R3-01: db['query'], ?.(), bind, call, деструктуризация, имя в строке, куски имени, eval; M3310-R4-01: экранирование имени, вызов по вычисляемому имени, перенос метода, Reflect, Proxy, прототип, разбор и цикл в свойство, import(); M3310-R5-01: переназначенная и затенённая таблица; M3310-R5-02: «+» после переноса строки, затенённая константа; M3310-R5-03: constructor, код в строке, нижний слой драйвера, Object.values, node -e, psql, vm, смена прототипа через запись по ключу; M3310-R6-01: изменённый список ключей — запись в элемент, push, передача в функцию; M3310-R6-02: process.getBuiltinModule; M3310-R6-03: exec/execSync, весь модуль, promisify, shell: true, -e из кусков, «node -e» одной строкой, импорт child_process вне списка файлов, sh -c с не постоянным сценарием, node без файла, NODE_OPTIONS, программа не из списка, оболочка со входа; подмена Object.freeze; M3310-R7-01: список, изменённый через обратный вызов, thisArg, метод с this, push.call; M3310-R7-02: sh -c 'eval "$1"', «. "$1"», та же строка через свою обёртку run, программа из параметра; M3310-R7-03: сценарии оболочки — psql -c из подстановки, помощник с текстом из подстановок, eval, программа из подстановки, heredoc с подстановкой, :x и \gexec, python -c, node -e, труба в psql, sh -c 'eval', psql -f; M3310-R8-01: подмена Object.freeze через другое имя, globalThis, разбор, передача Array, запись в замороженный список; M3310-R8-02: sh -c 'python3 -c …', docker … sh -ec, python3 в списке, оболочка со сценарием не из списка; M3310-R8-03: select в нижнем регистре в .execute, executemany и psql с текстом из параметра, eval, getattr)
