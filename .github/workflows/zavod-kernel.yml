          python3 - "$RUNNER_TEMP/tt" <<'PY'
          import io, os, sys, tarfile
          d = sys.argv[1]; os.mkdir(d)
          def mk(name, members):
              with tarfile.open(os.path.join(d, name), 'w:gz') as t:
                  for n, typ, data in members:
                      i = tarfile.TarInfo(n); i.type = typ; i.mode = 0o755
                      if typ == tarfile.SYMTYPE: i.linkname = '/etc/passwd'
                      if typ == tarfile.REGTYPE: i.size = len(data)
                      t.addfile(i, io.BytesIO(data) if typ == tarfile.REGTYPE else None)
          ok = ('package/a', tarfile.REGTYPE, b'a')
          mk('link.tgz', [ok, ('package/l', tarfile.SYMTYPE, b'')])
          mk('dotdot.tgz', [ok, ('package/../x', tarfile.REGTYPE, b'x')])
          mk('outside.tgz', [ok, ('other/x', tarfile.REGTYPE, b'x')])
          mk('dup.tgz', [ok, ('package/a', tarfile.REGTYPE, b'b')])
          mk('dev.tgz', [ok, ('package/d', tarfile.CHRTYPE, b'')])
          mk('good.tgz', [ok, ('package/s/b', tarfile.REGTYPE, b'b')])
          # аудит M-351B-R1B-03: управляющие знаки в имени (опись была бы неоднозначной)
          mk('lf.tgz', [ok, ('package/a\nb', tarfile.REGTYPE, b'x')])
          mk('cr.tgz', [ok, ('package/c\rd', tarfile.REGTYPE, b'x')])
          mk('del.tgz', [ok, ('package/e\x7ff', tarfile.REGTYPE, b'x')])
          PY
          # распаковка — в своей папке root 0700 (папка над DEST должна быть своей у запустившего)
          U=/var/tmp/zavod-tt; sudo install -d -o root -g root -m 0700 "$U"
          for t in link dotdot outside dup dev lf cr del; do
            if sudo python3 -I "$V/tools_tar_3_5_1b.py" unpack "$RUNNER_TEMP/tt/$t.tgz" "$U/out-$t" > "$RUNNER_TEMP/tt/$t.out" 2>&1; then cat "$RUNNER_TEMP/tt/$t.out"; exit 1; fi
            chk 'REFUSED: ' "$RUNNER_TEMP/tt/$t.out"
            sudo test ! -e "$U/out-$t"
          done
          for t in lf cr del; do
            if python3 -I "$V/tools_tar_3_5_1b.py" list "$RUNNER_TEMP/tt/$t.tgz" > "$RUNNER_TEMP/tt/$t-list.out" 2>&1; then exit 1; fi
            chk 'REFUSED: bad member name' "$RUNNER_TEMP/tt/$t-list.out"
          done
          sudo python3 -I "$V/tools_tar_3_5_1b.py" unpack "$RUNNER_TEMP/tt/good.tgz" "$U/out-good" > "$RUNNER_TEMP/tt/good.out"
          sudo python3 -I "$V/tools_tar_3_5_1b.py" inventory "$U/out-good" | cmp - "$RUNNER_TEMP/tt/good.out"
          python3 -I "$V/tools_tar_3_5_1b.py" list "$RUNNER_TEMP/tt/good.tgz" | cmp - "$RUNNER_TEMP/tt/good.out"
          # уже существующая папка назначения — отказ, ничего не перезаписано
          if sudo python3 -I "$V/tools_tar_3_5_1b.py" unpack "$RUNNER_TEMP/tt/good.tgz" "$U/out-good" > "$RUNNER_TEMP/tt/again.out" 2>&1; then exit 1; fi
          chk 'already exists: nothing unpacked' "$RUNNER_TEMP/tt/again.out"
          # опись папки: файл с переводом строки в имени — отказ
          sudo cp -a "$U/out-good" "$U/inv-lf"
          sudo install -o root -g root -m 0644 /dev/null "$U/inv-lf/x"$'\n'"y"
          if sudo python3 -I "$V/tools_tar_3_5_1b.py" inventory "$U/inv-lf" > "$RUNNER_TEMP/tt/inv-lf.out" 2>&1; then exit 1; fi
          chk 'REFUSED: .*: bad name' "$RUNNER_TEMP/tt/inv-lf.out"
          # аудит L-351B-R1B-01: ссылка в цепочке папок до DEST — отказ, в настоящую папку ничего не записано
          sudo install -d -o root -g root -m 0700 "$U/real"; sudo ln -s "$U/real" "$U/lnk"
          if sudo python3 -I "$V/tools_tar_3_5_1b.py" unpack "$RUNNER_TEMP/tt/good.tgz" "$U/lnk/out" > "$RUNNER_TEMP/tt/lnk.out" 2>&1; then exit 1; fi
          chk 'REFUSED: .*: not a plain folder at' "$RUNNER_TEMP/tt/lnk.out"
          sudo test ! -e "$U/real/out"
          # папка над DEST, куда могут писать другие, — отказ
          sudo install -d -o root -g root -m 0777 "$U/open"
          if sudo python3 -I "$V/tools_tar_3_5_1b.py" unpack "$RUNNER_TEMP/tt/good.tgz" "$U/open/out" > "$RUNNER_TEMP/tt/open.out" 2>&1; then exit 1; fi
          chk 'not a private folder of the caller' "$RUNNER_TEMP/tt/open.out"
          sudo test ! -e "$U/open/out"
          echo TOOLS_TAR_REFUSALS=OK
          # ТОЧНАЯ команда оператора: архив этого прогона по file://, @EXTRA@ — пусто (как у оператора)
          TAR=$(ls "$RUNNER_TEMP"/out/zavod-server-*.tar); FN=$(basename "$TAR")
          C12=$(printf '%s\n' "$FN" | sed -n 's/^zavod-server-\([0-9a-f]\{12\}\)-arm64\.tar$/\1/p'); test -n "$C12"
          GOOD=$(sha256sum "$TAR" | cut -d' ' -f1)
          opcmd() { tail -n 1 $V/operator_command_3_5_1b.txt | sed -e "s|@COMMIT12@|$C12|" -e "s|@FILE@|$FN|" \
            -e "s|@SHA256@|$GOOD|" -e "s|@URL@|file://$TAR|" -e "s|@EXTRA@||"; }
          EVD=/var/lib/zavod-install-3.5.1b; DL=$EVD/dl
          CL=/opt/zavod/tools/claude-code-2.1.318-linux-arm64; CX=/opt/zavod/tools/codex-0.166.0-linux-arm64
          # аудит M-351B-R2-01: чужой пакет с файловым триггером /usr/share/zavod-ci-trig (к Chrome отношения не имеет),
          #   ставится до шага, пока dpkg чист
          TG=$RUNNER_TEMP/trig; mkdir -p "$TG/DEBIAN"
          printf 'Package: zavod-ci-trig\nVersion: 1\nArchitecture: all\nMaintainer: ci <ci@example.invalid>\nDescription: CI trigger probe\n' > "$TG/DEBIAN/control"
          printf 'interest-noawait /usr/share/zavod-ci-trig\n' > "$TG/DEBIAN/triggers"
          dpkg-deb --build --root-owner-group "$TG" "$RUNNER_TEMP/trig.deb" > /dev/null
          sudo dpkg -i "$RUNNER_TEMP/trig.deb" > /dev/null
          # аудит M-351B-R3-01: чужой пакет с широким триггером /usr/share (предок файлов Chrome, но не из списка шага)
          TW=$RUNNER_TEMP/wide; mkdir -p "$TW/DEBIAN"
          printf 'Package: zavod-ci-wide\nVersion: 1\nArchitecture: all\nMaintainer: ci <ci@example.invalid>\nDescription: CI wide trigger probe\n' > "$TW/DEBIAN/control"
          printf 'interest-noawait /usr/share\n' > "$TW/DEBIAN/triggers"
          dpkg-deb --build --root-owner-group "$TW" "$RUNNER_TEMP/wide.deb" > /dev/null
          sudo dpkg -i "$RUNNER_TEMP/wide.deb" > /dev/null
          # (а0) аудит M-351B-R1B-01: обрыв первой установки — dpkg прерывается (kill -9), пока Chrome распаковывается;
