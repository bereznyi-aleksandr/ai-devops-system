          # аудит M3310-R15B: импорт за пределы проверяемых папок, файл дерева по относительному пути, $'…', опции ssh,
          # getattr у не модуля, среда службы, cwd и среда запуска — каждое на своём месте и своим кодом
          for at in 'bad_flow17.mjs:4: MODULE' 'bad_flow17.sh:5: SH_EXEC' 'bad_flow17.sh:6: SH_EXEC' 'bad_flow17.sh:7: SH_CMD' \
                    'bad_flow17.sh:8: SH_CMD' 'bad_flow17.sh:10: SH_CMD' 'bad_flow17.py:5: PY_RUN' 'bad17.service:5: UNIT_EXEC' \
                    'bad17.service:8: UNIT_EXEC' 'bad_flow18.mjs:6: CHILD_OPTS' 'bad_flow18.mjs:7: CHILD_OPTS'; do
            grep -q "^SQL_CONCAT zavod/kernel/ci/sql_concat_probe/$at: " "$RUNNER_TEMP/scan_probe.out" || { echo "probe case $at wrong"; exit 1; }
          done
          # аудит M3310-R16: приставки | + ! у строки запуска, ключи корня службы, вставка к юниту, tmpfiles, polkit,
          # nft include; обёртки и их опции, вложенность глубже предела, программы вне закрытого списка, среда,
          # запись в папки кода — каждое на своём месте и своим кодом
          for at in 'bad18.service:4: UNIT_SHELL' 'bad18.service:5: UNIT_PRIV' 'bad18.service:6: UNIT_PRIV' \
                    'bad18.service:7: UNIT_PRIV' 'bad18.service:8: UNIT_EXEC' 'bad18.service:9: UNIT_EXEC' \
                    'bad18.service:10: UNIT_EXEC' 'bad18_override.conf:5: UNIT_EXEC' 'bad18_override.conf:6: UNIT_EXEC' \
                    'bad18.tmpfiles.conf:3: UNIT_EXEC' 'bad18.rules:3: UNIT_EXEC' 'bad18.nft:3: UNIT_EXEC' \
                    'bad_flow19.sh:4: SH_CMD' 'bad_flow19.sh:5: SH_PARSE' 'bad_flow19.sh:6: SH_CMD' 'bad_flow19.sh:9: SH_CMD' \
                    'bad_flow19.sh:12: SH_CMD' 'bad_flow19.sh:14: SH_EXEC' 'bad_flow19.sh:15: SH_EXEC' \
                    'bad_flow19.sh:16: SH_INLINE' 'bad_flow19.sh:17: SH_INLINE' 'bad_flow19.sh:18: SH_CMD' \
                    'bad20.rules:4: UNIT_EXEC' 'bad20.rules:7: UNIT_EXEC' 'bad_flow20.sh:4: SH_CMD' 'bad_flow20.sh:6: SH_CMD' \
                    'bad_flow20.sh:7: SH_CMD' 'bad_flow20.sh:8: SH_CMD' 'bad_flow20.sh:12: SH_EXEC' 'bad_flow20.sh:14: SH_EXEC' \
                    'bad_flow20.sh:15: SH_EXEC' 'bad_flow20.sh:16: SH_EXEC' 'bad_flow20.sh:18: SH_EXEC' \
                    'bad_flow21.sh:5: SH_CMD' 'bad_flow21.sh:9: SH_CMD' 'bad_flow21.sh:10: SH_CMD' 'bad_flow21.sh:11: SH_CMD' \
                    'bad_flow21.sh:12: SH_EXEC' 'bad_flow21.sh:14: SH_EXEC' 'bad_flow21.sh:17: SH_EXEC' \
                    'bad_flow22.sh:8: SH_EXEC' 'bad_flow22.sh:10: SH_EXEC' 'bad_flow22.sh:13: SH_EXEC' 'bad_flow22.sh:15: SH_EXEC' \
                    'bad_flow22.sh:16: SH_EXEC' 'bad_flow22.sh:17: SH_EXEC' 'bad_flow22.sh:18: SH_EXEC' 'bad_flow22.sh:19: SH_EXEC' \
                    'bad_flow22.sh:20: SH_EXEC' 'bad_flow23.sh:7: SH_EXEC' 'bad_flow23.sh:11: SH_EXEC' 'bad_flow24.sh:7: SH_EXEC' \
                    'bad_flow24.sh:10: SH_EXEC' 'bad_flow24.sh:13: SH_EXEC' 'bad_flow24.sh:15: SH_EXEC' \
                    'bad_flow24.sh:28: SH_EXEC' 'bad_flow24.sh:29: SH_EXEC' 'bad_flow22.sh:27: SH_EXEC' \
                    'bad_flow25.sh:6: SH_EXEC' 'bad_flow25.sh:7: SH_EXEC' 'bad_flow25.sh:8: SH_EXEC' 'bad_flow25.sh:9: SH_EXEC' \
                    'bad_flow25.sh:10: SH_EXEC' 'bad_flow25.sh:11: SH_EXEC' 'bad_flow25.sh:12: SH_CMD' 'bad_flow25.sh:13: SH_CMD' \
                    'bad_flow25.sh:14: SH_CMD' 'bad_flow25.sh:15: SH_CMD' 'bad_flow25.sh:16: SH_CMD' 'bad_flow25.sh:17: SH_CMD' \
                    'bad_flow25.sh:18: SH_CMD' 'foreign25.service:11: UNIT_EXEC'; do
            grep -q "^SQL_CONCAT zavod/kernel/ci/sql_concat_probe/$at: " "$RUNNER_TEMP/scan_probe.out" || { echo "probe case $at wrong"; exit 1; }
          done
          # аудит M3310-R19: верное НЕ ловится — установка из своей папки всегда (set -e) и чтение того же пути,
          # запуск юнита дерева, который сценарий поставил, юнит ОС
          # аудит M3310-R20-02: запись в путь из подстановки с другим именем или окончанием (в том числе копия .bak) и
          # touch не снимают разрешение
          # аудит M3310-R21: остановка юнита дерева (и всех экземпляров его шаблона) и юнита ОС, disable и mask без
          # --now, sort и systemd-analyze в закрытых формах
          for at in bad_flow22.sh:22 bad_flow22.sh:24 bad_flow22.sh:26 bad_flow22.sh:28 \
                    bad_flow24.sh:18 bad_flow24.sh:20 bad_flow24.sh:21 bad_flow24.sh:22 bad_flow24.sh:23 \
                    bad_flow25.sh:19 bad_flow25.sh:20 bad_flow25.sh:21 bad_flow25.sh:22 bad_flow25.sh:23 bad_flow25.sh:24 \
                    bad_flow25.sh:25 bad_flow25.sh:26 bad_flow25.sh:27 bad_flow25.sh:28 bad_flow25.sh:29 bad_flow25.sh:30 \
                    bad_flow25.sh:31; do
            ! grep -q "^SQL_CONCAT zavod/kernel/ci/sql_concat_probe/$at: " "$RUNNER_TEMP/scan_probe.out" || { echo "probe line $at caught"; exit 1; }
          done
          # аудит M3310-R21-02: проверка на деле — GNU sort запускает программу из --compress-program (безопасная
          # заглушка только пишет метку и пропускает данные); у сценария дерева такая строка — находка (bad_flow25.sh:12, 13)
          printf '#!/bin/sh\necho ran >> "%s/sort_helper.mark"\ncat\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/sort_helper.sh"
          chmod 0755 "$RUNNER_TEMP/sort_helper.sh"
          seq 1 200000 > "$RUNNER_TEMP/sort_in.txt"
          sort -S 64K -T "$RUNNER_TEMP" --compress-program="$RUNNER_TEMP/sort_helper.sh" "$RUNNER_TEMP/sort_in.txt" > /dev/null
          test -s "$RUNNER_TEMP/sort_helper.mark"
          echo "SORT_COMPRESS_PROGRAM_RUNS=yes ($(wc -l < "$RUNNER_TEMP/sort_helper.mark") runs); bad_flow25.sh:12 caught"
          # R16-01/02: строка UNIT_SHELL — отказ, находка «|» остаётся; UNIT_PRIV снимается только точной строкой
          if python3 -I "$S" --allow zavod/kernel/ci/sql_concat_probe/bad_allow19.txt zavod/kernel/ci/sql_concat_probe/bad18.service \
            > "$RUNNER_TEMP/scan_allow19.out"; then echo 'allow19 passed'; exit 1; fi
          test "$(grep -c '^SQL_CONCAT_ALLOW_BAD .*.UNIT_SHELL.' "$RUNNER_TEMP/scan_allow19.out")" = 1
          grep -q '^SQL_CONCAT zavod/kernel/ci/sql_concat_probe/bad18.service:4: UNIT_SHELL: ' "$RUNNER_TEMP/scan_allow19.out"
          ! grep -q '^SQL_CONCAT zavod/kernel/ci/sql_concat_probe/bad18.service:5: UNIT_PRIV: ' "$RUNNER_TEMP/scan_allow19.out"
          grep -q '^SQL_CONCAT zavod/kernel/ci/sql_concat_probe/bad18.service:6: UNIT_PRIV: ' "$RUNNER_TEMP/scan_allow19.out"
          # R15B-07: файл закреплён верной суммой, запуск разрешён — cwd и среда остаются находками, строка CHILD_OPTS — отказ
          if python3 -I "$S" --allow zavod/kernel/ci/sql_concat_probe/bad_pin18.txt zavod/kernel/ci/sql_concat_probe/bad_flow18.mjs \
            > "$RUNNER_TEMP/scan_pin18.out"; then echo 'pin18 passed'; exit 1; fi
          test "$(grep -c '^SQL_CONCAT_ALLOW_BAD .*.CHILD_OPTS.' "$RUNNER_TEMP/scan_pin18.out")" = 1
          test "$(grep -c '^SQL_CONCAT zavod/kernel/ci/sql_concat_probe/bad_flow18.mjs:[67]: CHILD_OPTS: ' "$RUNNER_TEMP/scan_pin18.out")" = 2
          ! grep -q 'PIN: file that starts programs' "$RUNNER_TEMP/scan_pin18.out"
          echo SQL_CONCAT_PROBE=caught
      - name: cell checks (CELL_CI=PASS)
        shell: bash
        run: |
          set -euo pipefail
          bash zavod/ops/server/cell/cell_ci.sh | tee "$RUNNER_TEMP/cell_ci.out"
          grep -qx CELL_CI=PASS "$RUNNER_TEMP/cell_ci.out"
      - name: archive quarantine and trusted import, probe PB-4 (INTAKE_CI=PASS)
        shell: bash
        run: |
          set -euo pipefail
          bash zavod/ops/server/cell/intake_ci.sh | tee "$RUNNER_TEMP/intake_ci.out"
          grep -qx INTAKE_CI=PASS "$RUNNER_TEMP/intake_ci.out"
      - name: gate and egress only through the proxy, probes PB-5 and PB-3 (EGRESS_CI=PASS)
        shell: bash
        run: |
          set -euo pipefail
          bash zavod/ops/server/cell/egress_ci.sh | tee "$RUNNER_TEMP/egress_ci.out"
          grep -qx EGRESS_CI=PASS "$RUNNER_TEMP/egress_ci.out"

  server_package:
    name: server package built and installed twice on a fresh Ubuntu 24.04, ${{ matrix.arch }} (3.3.11, 3.5.1)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
      - name: build the package (closed file list, pinned externals, MANIFEST.sha256)
        shell: bash
        run: |
          set -euo pipefail
          python3 -I zavod/ops/server/build_server_package.py "$RUNNER_TEMP/out" --arch "$ARCH" | tee "$RUNNER_TEMP/build1.out"
          grep -q '^ZAVOD_SERVER_PACKAGE=OK ' "$RUNNER_TEMP/build1.out"
          # тот же вход — тот же архив (3.3.11.4: суммы доказывают, что установлен проверенный пакет)
          python3 -I zavod/ops/server/build_server_package.py "$RUNNER_TEMP/out2" --arch "$ARCH" | tee "$RUNNER_TEMP/build2.out"
          test "$(sed 's/.* sha256=//' "$RUNNER_TEMP/build1.out")" = "$(sed 's/.* sha256=//' "$RUNNER_TEMP/build2.out")"
          mkdir "$RUNNER_TEMP/pkg"
          tar -C "$RUNNER_TEMP/pkg" -xf "$RUNNER_TEMP"/out/zavod-server-*.tar
          # карта 3.5.1: опись называет процессор пакета, в пакете Node.js этого процессора
          test "$(sed -n 2p "$RUNNER_TEMP/pkg/MANIFEST.sha256")" = "#arch $ARCH"
          test -f "$RUNNER_TEMP/pkg/runtime/node-v22.23.3-linux-$ARCH.tar.xz"
          echo SERVER_PACKAGE_BUILD=OK
          # аудит M3311-R1-01: отслеживаемый файл изменён, но не зафиксирован — отказ сборки
          printf '\n' >> zavod/kernel/src/server.mjs
          if python3 -I zavod/ops/server/build_server_package.py "$RUNNER_TEMP/out3" > "$RUNNER_TEMP/build3.out" 2>&1; then exit 1; fi
          grep -q 'ZAVOD_SERVER_PACKAGE=FAIL worktree differs from HEAD' "$RUNNER_TEMP/build3.out"
          git checkout -- zavod/kernel/src/server.mjs
          # аудит M3311-R1-01: символическая ссылка в коммите (копия хранилища) — отказ сборки
          git clone -q --no-hardlinks . "$RUNNER_TEMP/symrepo"
          ln -s /etc/passwd "$RUNNER_TEMP/symrepo/zavod/kernel/src/zz_link.mjs"
          git -C "$RUNNER_TEMP/symrepo" add zavod/kernel/src/zz_link.mjs
          git -C "$RUNNER_TEMP/symrepo" -c user.name=ci -c user.email=ci@example.invalid commit -q -m link
          if (cd "$RUNNER_TEMP/symrepo" && python3 -I zavod/ops/server/build_server_package.py "$RUNNER_TEMP/out4") > "$RUNNER_TEMP/build4.out" 2>&1; then exit 1; fi
          grep -q 'ZAVOD_SERVER_PACKAGE=FAIL git mode 120000 blob is not a regular file: zavod/kernel/src/zz_link.mjs' "$RUNNER_TEMP/build4.out"
          echo SERVER_PACKAGE_BUILD_REFUSALS=OK
      - name: keep the built package as a CI artifact (audit M3311-R1-05)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zavod-server-package-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 30
      - name: install twice (same result), refusals on a changed package
        shell: bash
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/pkg"
          # Node.js машины GitHub убирается с пути службы ядра (переименование, не удаление): установщик ставит свой.
          if [ -e /usr/bin/node ]; then sudo mv /usr/bin/node /usr/bin/node.runner-image; fi
          # На машине GitHub /opt открыта на запись (там кэш программ машины); на чистой Ubuntu 24.04 это root:root 0755.
          # Установщик требует закрытых папок выше /opt/zavod (аудит M3311-R2-02) — машина приводится к виду сервера.
          stat -c 'opt before: %U:%G %a' /opt
          sudo chown root:root /opt
          sudo chmod 0755 /opt
          O='--session-fs-size 64M --intake-fs-size 192M --intake-fs-inodes 2048 --intake-journal-size 16M --min-free 1G'
          # карта 3.5.1, аудит C-351-R1-01: общая команда этапа идёт только в SSH-сеансе root, вошедшем по ключу. На машине
          # GitHub — одноразовый ключ CI и настоящий вход ssh на 127.0.0.1 (на сервере — ключ оператора с телефона).
          command -v sshd > /dev/null || sudo apt-get install -y -qq openssh-server > /dev/null
          ssh-keygen -q -t ed25519 -N '' -C zavod-ci-root -f "$RUNNER_TEMP/ci_root_key"
          sudo install -d -o root -g root -m 0700 /root/.ssh
          sudo tee -a /root/.ssh/authorized_keys < "$RUNNER_TEMP/ci_root_key.pub" > /dev/null
          sudo chmod 0600 /root/.ssh/authorized_keys
          sudo systemctl start ssh.service || sudo systemctl start ssh.socket
          cissh() { ssh -i "$RUNNER_TEMP/ci_root_key" -o IdentitiesOnly=yes -o BatchMode=yes -o PreferredAuthentications=publickey \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" root@127.0.0.1 "$@"; }
          cissh true
          # аудит M-351-R1-01/03: пакет распаковывается от root в закрытую папку (tar --no-same-owner), как на сервере
          PR=/root/zavod-pkg
          sudo install -d -o root -g root -m 0755 "$PR"
          sudo tar -C "$PR" --no-same-owner -xf "$RUNNER_TEMP"/out/zavod-server-*.tar
          S=zavod/ops/server/install_stage_3_5_1.sh
          DROP=/etc/ssh/sshd_config.d/00-zavod-no-password.conf
          nothing_changed() { test ! -e /opt/zavod; sudo test ! -e "$DROP"; }
          # при провале проверки строки — весь вывод команды в журнал (иначе причина не видна)
          chk() { grep -q -- "$1" "$2" && return 0; echo "MISSING [$1] in $2:"; cat "$2"; return 1; }
          # пакет другого процессора — отказ общей команды и установщика до любых изменений
          OTHER=x64; [ "$ARCH" = x64 ] && OTHER=arm64
          cp -a "$P" "$RUNNER_TEMP/bad0"
          sed -i "2s/.*/#arch $OTHER/" "$RUNNER_TEMP/bad0/MANIFEST.sha256"
          if sudo bash "$RUNNER_TEMP/bad0/$S" "$RUNNER_TEMP/bad0" > "$RUNNER_TEMP/bad0a.out" 2>&1; then cat "$RUNNER_TEMP/bad0a.out"; exit 1; fi
          chk "REFUSED: package is not for this processor ($ARCH): #arch $OTHER" "$RUNNER_TEMP/bad0a.out"
          if sudo bash "$RUNNER_TEMP/bad0/zavod/ops/server/install_server.sh" "$RUNNER_TEMP/bad0" > "$RUNNER_TEMP/bad0b.out" 2>&1; then cat "$RUNNER_TEMP/bad0b.out"; exit 1; fi
          chk "REFUSED: package is for $OTHER, this server is $ARCH" "$RUNNER_TEMP/bad0b.out"
          nothing_changed
          echo SERVER_ARCH_REFUSAL=OK
          # аудит M-351-R1-01: лишний файл и символическая ссылка в пакете — отказ общей команды на шаге 0, ничего не изменено
          cp -a "$P" "$RUNNER_TEMP/s_extra"
          printf 'x' > "$RUNNER_TEMP/s_extra/zavod/extra.txt"
          if sudo bash "$RUNNER_TEMP/s_extra/$S" "$RUNNER_TEMP/s_extra" > "$RUNNER_TEMP/s_extra.out" 2>&1; then cat "$RUNNER_TEMP/s_extra.out"; exit 1; fi
          chk 'REFUSED: files not in the manifest' "$RUNNER_TEMP/s_extra.out"
          cp -a "$P" "$RUNNER_TEMP/s_link"
          cp "$P/zavod/kernel/src/server.mjs" "$RUNNER_TEMP/s_outside.mjs"
          ln -sf "$RUNNER_TEMP/s_outside.mjs" "$RUNNER_TEMP/s_link/zavod/kernel/src/server.mjs"
          if sudo bash "$RUNNER_TEMP/s_link/$S" "$RUNNER_TEMP/s_link" > "$RUNNER_TEMP/s_link.out" 2>&1; then cat "$RUNNER_TEMP/s_link.out"; exit 1; fi
          chk 'REFUSED: not a regular file or directory: zavod/kernel/src/server.mjs' "$RUNNER_TEMP/s_link.out"
          # верный пакет, но папка не закрыта (владелец — пользователь машины CI) — отказ на шаге 0
          if sudo bash "$P/$S" "$P" > "$RUNNER_TEMP/s_open.out" 2>&1; then cat "$RUNNER_TEMP/s_open.out"; exit 1; fi
          chk 'REFUSED: package folder is not closed: nothing changed' "$RUNNER_TEMP/s_open.out"
          # не из SSH-сеанса (консоль, sudo) — отказ; --no-upgrade вне машины CI (sudo без GITHUB_ACTIONS) — отказ
          if sudo bash "$PR/$S" "$PR" > "$RUNNER_TEMP/s_nossh.out" 2>&1; then cat "$RUNNER_TEMP/s_nossh.out"; exit 1; fi
          chk 'REFUSED: run this command in an SSH session of root logged in by key' "$RUNNER_TEMP/s_nossh.out"
          if cissh "bash $PR/$S $PR --no-upgrade" > "$RUNNER_TEMP/s_noupg.out" 2>&1; then cat "$RUNNER_TEMP/s_noupg.out"; exit 1; fi
          chk 'REFUSED: --no-upgrade is for the CI machine only' "$RUNNER_TEMP/s_noupg.out"
          if cissh "ZAVOD_CI_APT_SIM=1 bash $PR/$S $PR" > "$RUNNER_TEMP/s_nosim.out" 2>&1; then cat "$RUNNER_TEMP/s_nosim.out"; exit 1; fi
          chk 'REFUSED: ZAVOD_CI_APT_SIM is for the CI machine only' "$RUNNER_TEMP/s_nosim.out"
          nothing_changed
          echo STAGE_STEP0_REFUSALS=OK
          # аудит M-351-R1-03: ветка обновления в режиме имитации — нужна перезагрузка: код 3, ничего не изменено;
          # «перезагрузка» — флаг переименовывается (не удаляется), повтор идёт дальше
          if sudo test -e /var/run/reboot-required; then sudo mv /var/run/reboot-required /var/run/reboot-required.ci-image; fi
          sudo touch /var/run/reboot-required
          CIENV="GITHUB_ACTIONS=true"
          rc=0; cissh "$CIENV ZAVOD_CI_APT_SIM=1 bash $PR/$S $PR $O" > "$RUNNER_TEMP/s_reboot.out" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/s_reboot.out"
          test "$rc" = 3
          chk '^REBOOT_REQUIRED: ' "$RUNNER_TEMP/s_reboot.out"
          nothing_changed
          sudo mv /var/run/reboot-required /var/run/reboot-required.ci-simulated-reboot
          echo STAGE_REBOOT_BRANCH=OK
          # аудит C-351-R1-01: сеанс A вошёл по ключу ДО выключения пароля и ждёт; сеанс B — первый проход (код 4);
          # затем A повторяет команду — отказ (код 4: его вход был до настройки); новый сеанс C — второй проход, OK.
          cissh "while [ ! -e /run/zavod-ci-go ]; do sleep 1; done; $CIENV bash $PR/$S $PR --no-upgrade $O" > "$RUNNER_TEMP/s_old.out" 2>&1 &
          OLD=$!
          sleep 3
          rc=0; cissh "$CIENV ZAVOD_CI_APT_SIM=1 bash $PR/$S $PR $O" > "$RUNNER_TEMP/s_phase1.out" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/s_phase1.out"
          test "$rc" = 4
          chk '^SYSTEM_UPGRADE=SIMULATED (CI)$' "$RUNNER_TEMP/s_phase1.out"
          chk "^SSH_PASSWORD_LOGIN=OFF file=$DROP$" "$RUNNER_TEMP/s_phase1.out"
          chk '^RELOGIN_REQUIRED: ' "$RUNNER_TEMP/s_phase1.out"
          test ! -e /opt/zavod
          sudo touch /run/zavod-ci-go
          rc=0; wait "$OLD" || rc=$?
          cat "$RUNNER_TEMP/s_old.out"
          test "$rc" = 4
          chk 'этот сеанс начался до выключения пароля' "$RUNNER_TEMP/s_old.out"
          test ! -e /opt/zavod
          sudo sshd -T -C user=root,host=127.0.0.1,addr=127.0.0.1 | grep -qx 'passwordauthentication no'
          echo STAGE_SSH_TWO_PHASE=OK
          # shellcheck disable=SC2086
          cissh "$CIENV ZAVOD_CI_APT_SIM=1 bash $PR/$S $PR $O" | tee "$RUNNER_TEMP/server1.out"
          grep -qx ZAVOD_SERVER_INSTALL=OK "$RUNNER_TEMP/server1.out"
          grep -qx ZAVOD_3_5_1=OK "$RUNNER_TEMP/server1.out"
          grep -q '^SSH_RELOGIN=OK session=127.0.0.1:' "$RUNNER_TEMP/server1.out"
          grep -q '^PG_CHAIN_ACCESS=restored byte-identical' "$RUNNER_TEMP/server1.out"
          grep -q "^POINT_B=OK sh=[1-9][0-9]* py=[1-9][0-9]* git=.* node=v22\.23\.3$" "$RUNNER_TEMP/server1.out"
          grep -q "^ELF_ARCH=OK arch=$ARCH programs=[1-9]" "$RUNNER_TEMP/server1.out"
          grep -q '^PROBE_SESSION=OK lease=[0-9a-f-]\{36\} cage=closed stopped=INTERRUPTED$' "$RUNNER_TEMP/server1.out"
          grep -q '^PROBE_LEASES=1 ids=[0-9a-f-]\{36\} ' "$RUNNER_TEMP/server1.out"
          sudo sshd -T -C user=root,host=localhost,addr=127.0.0.1 | grep -qx 'passwordauthentication no'
          R1=$(sudo sh -c 'ls /root/zavod-install-3.5.1-*.txt')
          test "$(printf '%s\n' "$R1" | wc -l)" = 1
          test "$(sudo stat -c '%U:%G %a' "$R1")" = 'root:root 600'
          sudo grep -qx ZAVOD_3_5_1=OK "$R1"
          # аудит M3311-R1-04: опись ОС в отчёте — семь пакетов APT с версией и сумма списка всех пакетов
          test "$(grep -c '^ZAVOD_SERVER_OS_PACKAGE=[a-z0-9.+-]*=[^ ]' "$RUNNER_TEMP/server1.out")" = 7
          grep -q '^ZAVOD_SERVER_OS=ubuntu-24.04 kernel=.* bom_sha256=[0-9a-f]\{64\}$' "$RUNNER_TEMP/server1.out"
          # сумма файла администратора движка — только для сравнения, не выводится
          A1=$(sudo sha256sum /etc/zavod/engine_admin.conf)
          sleep 1
          # состояние файлов настройки базы после первой установки (для разбора, если повтор откажет)
          sudo sh -c 'for f in /etc/postgresql/16/main/conf.d/*; do stat -c "%n %U:%G %a %s" "$f"; od -c "$f" | head -3; done'
          cissh "$CIENV bash $PR/$S $PR --no-upgrade $O" | tee "$RUNNER_TEMP/server2.out"
          grep -qx ZAVOD_SERVER_INSTALL=OK "$RUNNER_TEMP/server2.out"
          grep -qx ZAVOD_3_5_1=OK "$RUNNER_TEMP/server2.out"
          test "$A1" = "$(sudo sha256sum /etc/zavod/engine_admin.conf)"
          echo ADMIN_FILE_STABLE=OK
          # аудит L-351-R1-01 и M-351-R1-02: повтор того же выпуска — прежняя проба (новой OPEN-аренды нет), новый отчёт
          # рядом с прежним (прежний не тронут)
          grep -q '^PROBE_SESSION=OK lease=[0-9a-f-]\{36\} cage=closed stopped=INTERRUPTED reused=1 ' "$RUNNER_TEMP/server2.out"
          grep -q '^PROBE_LEASES=1 ' "$RUNNER_TEMP/server2.out"
          test "$(sudo sh -c 'ls /root/zavod-install-3.5.1-*.txt' | wc -l)" = 2
          sudo grep -qx ZAVOD_3_5_1=OK "$R1"
          # аудит M-351-R1-02: изменённая на сервере служба не заменяется — отказ; после возврата байтов снова OK
          sudo cp -p /etc/systemd/system/zavod-kernel.service "$RUNNER_TEMP/keep_kernel.service"
          printf '# changed on the server\n' | sudo tee -a /etc/systemd/system/zavod-kernel.service > /dev/null
          # shellcheck disable=SC2086
          if sudo bash "$P/zavod/ops/server/install_server.sh" "$P" $O > "$RUNNER_TEMP/s_unit.out" 2>&1; then cat "$RUNNER_TEMP/s_unit.out"; exit 1; fi
          chk 'REFUSED: /etc/systemd/system/zavod-kernel.service exists and differs from the package' "$RUNNER_TEMP/s_unit.out"
          sudo cp -p "$RUNNER_TEMP/keep_kernel.service" /etc/systemd/system/zavod-kernel.service
          echo STAGE_NO_OVERWRITE=OK
          # дальше каждая команда видна в журнале: провал сразу показывает, какая проверка не прошла
          set -x
          test "$(grep '^ZAVOD_SERVER_RELEASE=' "$RUNNER_TEMP/server1.out")" = "$(grep '^ZAVOD_SERVER_RELEASE=' "$RUNNER_TEMP/server2.out")"
          grep -q 'база bem уже есть' "$RUNNER_TEMP/server2.out"
          /usr/bin/node --version | grep -q '^v22\.23\.3$'
          test "$(sudo -u postgres psql -Atc 'show listen_addresses')" = ''
          # временный вход цепочки базы убран
          if sudo grep -q zavod-install-chain /etc/postgresql/16/main/pg_hba.conf /etc/postgresql/16/main/pg_ident.conf; then exit 1; fi
          systemctl is-enabled zavod-kernel.service | grep -qx enabled
          systemd-analyze verify /etc/systemd/system/zavod-kernel.service
          # движок: служба работает, своя база и схема, вход без учётной записи — 401, в базу bem движку хода нет
          grep -qx ENGINE=OK "$RUNNER_TEMP/server2.out"
          systemctl is-active zavod-engine.service | grep -qx active
          systemd-analyze verify /etc/systemd/system/zavod-engine.service
          test "$(sudo stat -c '%U:%G %a' /etc/zavod/engine_admin.conf)" = 'root:root 600'
          test "$(sudo -u postgres psql -d bem_engine -Atc "select count(*) > 10 from information_schema.tables where table_schema = 'bem_engine' and table_name like 'act_%'")" = t
          test "$(sudo -u postgres psql -d bem_engine -Atc "select count(*) from information_schema.tables where table_schema = 'public'")" = 0
          if sudo -u zflowable psql -h /var/run/postgresql -d bem -Atc 'select 1' > /dev/null 2>&1; then exit 1; fi
          # порт 8091 слушается только на 127.0.0.1 (без grep -q в конвейере: он обрывает awk, и pipefail даёт провал)
          # проверка отказа выше перезапускает PostgreSQL, движок переподключается — ждём порт до 180 с
          for i in $(seq 1 90); do
            L=$(ss -ltnH 'sport = :8091' | awk '{print $4}' | sort -u)
            [ "$L" = '127.0.0.1:8091' ] && break
            sleep 2
          done
          test "$L" = '127.0.0.1:8091'
          # сужение фильтра (3.3.11): ядро достаёт только движок; движок и ядро не выходят в интернет
          T='import socket,sys
          try:
              socket.create_connection((sys.argv[1], int(sys.argv[2])), timeout=5).close(); print("OPEN")
          except OSError as e:
              print("DENIED", e.errno)'
          test "$(sudo -u zkernel python3 -I -c "$T" 127.0.0.1 8091)" = OPEN
          r=$(sudo -u zkernel python3 -I -c "$T" 1.1.1.1 443); test "${r%% *}" = DENIED
          r=$(sudo -u zflowable python3 -I -c "$T" 1.1.1.1 443); test "${r%% *}" = DENIED
          r=$(sudo -u zkernel python3 -I -c "$T" 127.0.0.2 3128); test "${r%% *}" = DENIED
          echo EGRESS_NARROW=OK
          # изменённый файл пакета — отказ до установки
          cp -a "$P" "$RUNNER_TEMP/bad"
          printf '\n' >> "$RUNNER_TEMP/bad/zavod/kernel/src/server.mjs"
          if sudo bash "$RUNNER_TEMP/bad/zavod/ops/server/install_server.sh" "$RUNNER_TEMP/bad" > "$RUNNER_TEMP/bad1.out" 2>&1; then exit 1; fi
          grep -q 'REFUSED: package files differ from the manifest' "$RUNNER_TEMP/bad1.out"
          # лишний файл — отказ
          cp -a "$P" "$RUNNER_TEMP/bad2"
          printf 'x' > "$RUNNER_TEMP/bad2/zavod/extra.txt"
          if sudo bash "$RUNNER_TEMP/bad2/zavod/ops/server/install_server.sh" "$RUNNER_TEMP/bad2" > "$RUNNER_TEMP/bad2.out" 2>&1; then exit 1; fi
          grep -q 'REFUSED: files not in the manifest' "$RUNNER_TEMP/bad2.out"
          # аудит M3311-R1-02: файл пакета заменён ссылкой на внешний файл с тем же содержимым — отказ
          cp -a "$P" "$RUNNER_TEMP/bad3"
          cp "$P/zavod/kernel/src/server.mjs" "$RUNNER_TEMP/outside_server.mjs"
          ln -sf "$RUNNER_TEMP/outside_server.mjs" "$RUNNER_TEMP/bad3/zavod/kernel/src/server.mjs"
          if sudo bash "$RUNNER_TEMP/bad3/zavod/ops/server/install_server.sh" "$RUNNER_TEMP/bad3" > "$RUNNER_TEMP/bad3.out" 2>&1; then exit 1; fi
          grep -q 'REFUSED: not a regular file or directory: zavod/kernel/src/server.mjs' "$RUNNER_TEMP/bad3.out"
          # папка пакета заменена ссылкой на папку вне пакета — отказ
          cp -a "$P" "$RUNNER_TEMP/bad4"
          mv "$RUNNER_TEMP/bad4/zavod/kernel/src" "$RUNNER_TEMP/outside_src"
          ln -s "$RUNNER_TEMP/outside_src" "$RUNNER_TEMP/bad4/zavod/kernel/src"
          if sudo bash "$RUNNER_TEMP/bad4/zavod/ops/server/install_server.sh" "$RUNNER_TEMP/bad4" > "$RUNNER_TEMP/bad4.out" 2>&1; then exit 1; fi
          grep -q 'REFUSED: not a regular file or directory: zavod/kernel/src' "$RUNNER_TEMP/bad4.out"
          # жёсткая ссылка — отказ
          cp -a "$P" "$RUNNER_TEMP/bad5"
          ln "$RUNNER_TEMP/bad5/zavod/kernel/src/server.mjs" "$RUNNER_TEMP/hard_server.mjs"
          if sudo bash "$RUNNER_TEMP/bad5/zavod/ops/server/install_server.sh" "$RUNNER_TEMP/bad5" > "$RUNNER_TEMP/bad5.out" 2>&1; then exit 1; fi
          grep -q 'REFUSED: hard link in the package: zavod/kernel/src/server.mjs' "$RUNNER_TEMP/bad5.out"
          # права файла не как в описи — отказ
          cp -a "$P" "$RUNNER_TEMP/bad6"
          chmod 0755 "$RUNNER_TEMP/bad6/zavod/kernel/src/server.mjs"
          if sudo bash "$RUNNER_TEMP/bad6/zavod/ops/server/install_server.sh" "$RUNNER_TEMP/bad6" > "$RUNNER_TEMP/bad6.out" 2>&1; then exit 1; fi
          grep -q 'REFUSED: file mode differs from the manifest: zavod/kernel/src/server.mjs' "$RUNNER_TEMP/bad6.out"
          echo SERVER_PACKAGE_REFUSALS=OK
          # аудит M3311-R2-01: уже существующая папка Node.js с изменённым файлом — отказ до использования
          ND=/opt/zavod/node-v22.23.3-linux-$ARCH
          NV=include/node/node_version.h
          sudo cp -p "$ND/$NV" "$RUNNER_TEMP/keep_node_version.h"
          printf 'x' | sudo tee -a "$ND/$NV" > /dev/null
          # shellcheck disable=SC2086
          if sudo bash "$P/zavod/ops/server/install_server.sh" "$P" $O > "$RUNNER_TEMP/bad7.out" 2>&1; then exit 1; fi
          grep -q "REFUSED: $ND: node tree differs from the archive: $NV" "$RUNNER_TEMP/bad7.out"
          sudo cp -p "$RUNNER_TEMP/keep_node_version.h" "$ND/$NV"
          # частично распакованная папка Node.js (файла нет) — отказ
          sudo mv "$ND/$NV" "$RUNNER_TEMP/moved_node_version.h"
          # shellcheck disable=SC2086
          if sudo bash "$P/zavod/ops/server/install_server.sh" "$P" $O > "$RUNNER_TEMP/bad8.out" 2>&1; then exit 1; fi
          grep -q "REFUSED: $ND: missing from the node tree: $NV" "$RUNNER_TEMP/bad8.out"
          sudo mv "$RUNNER_TEMP/moved_node_version.h" "$ND/$NV"
          # аудит M3311-R2-02: файл выпуска с верными байтами и правами, но чужим владельцем — отказ до current
          REL=$(readlink -f /opt/zavod/current)
          F=zavod/kernel/src/server.mjs
          sudo chown zflowable "$REL/$F"
          # shellcheck disable=SC2086
          if sudo bash "$P/zavod/ops/server/install_server.sh" "$P" $O > "$RUNNER_TEMP/bad9.out" 2>&1; then exit 1; fi
          grep -q "REFUSED: $REL: not owned by root:root: $F" "$RUNNER_TEMP/bad9.out"
          sudo chown root:root "$REL/$F"
          # папка выпуска открыта на запись группе — отказ
          sudo chmod g+w "$REL/zavod/kernel"
          # shellcheck disable=SC2086
          if sudo bash "$P/zavod/ops/server/install_server.sh" "$P" $O > "$RUNNER_TEMP/bad10.out" 2>&1; then exit 1; fi
          grep -q "REFUSED: $REL: writable for group or others: zavod/kernel" "$RUNNER_TEMP/bad10.out"
          sudo chmod g-w "$REL/zavod/kernel"
          # папка выше открыта на запись — отказ (/opt/zavod и /opt/zavod/releases установщик сам ставит root 0755
          # командой install -d; /opt он не меняет — её и открываем)
          sudo chmod o+w /opt
          # shellcheck disable=SC2086
          if sudo bash "$P/zavod/ops/server/install_server.sh" "$P" $O > "$RUNNER_TEMP/bad11.out" 2>&1; then exit 1; fi
          grep -q "REFUSED: /opt: directory above $ND is not root-owned and closed for writing" "$RUNNER_TEMP/bad11.out"
          sudo chmod o-w /opt
          # всё возвращено — та же установка снова проходит (проверки не ломают повторный запуск)
          # shellcheck disable=SC2086
          sudo bash "$P/zavod/ops/server/install_server.sh" "$P" $O > "$RUNNER_TEMP/server3.out" 2>&1
          grep -qx ZAVOD_SERVER_INSTALL=OK "$RUNNER_TEMP/server3.out"
          grep -q "^NODE_TREE=OK dir=$ND entries=" "$RUNNER_TEMP/server3.out"
          grep -q "^RELEASE_TREE=OK dir=$REL entries=" "$RUNNER_TEMP/server3.out"
          grep -q "^ELF_ARCH=OK arch=$ARCH programs=[1-9]" "$RUNNER_TEMP/server3.out"
          # карта 3.5.1: программа чужого процессора в выпуске (root, верные права) — отказ до current
          python3 -I -c 'import sys; m = 183 if sys.argv[2] == "x64" else 62; open(sys.argv[1], "wb").write(b"\x7fELF\x02\x01\x01" + bytes(11) + m.to_bytes(2, "little") + bytes(44))' "$RUNNER_TEMP/foreign.elf" "$ARCH"
          sudo install -o root -g root -m 0644 "$RUNNER_TEMP/foreign.elf" "$REL/zz_foreign.elf"
          # shellcheck disable=SC2086
          if sudo bash "$P/zavod/ops/server/install_server.sh" "$P" $O > "$RUNNER_TEMP/bad13.out" 2>&1; then exit 1; fi
          grep -q "REFUSED: $REL/zz_foreign.elf: program for another processor" "$RUNNER_TEMP/bad13.out"
          sudo mv "$REL/zz_foreign.elf" "$RUNNER_TEMP/foreign_moved.elf"
          # жёсткая ссылка на файл выпуска — отказ (последняя проба: ссылка остаётся до конца прогона)
          sudo ln "$REL/$F" /opt/zavod/hard_server.mjs
          # shellcheck disable=SC2086
          if sudo bash "$P/zavod/ops/server/install_server.sh" "$P" $O > "$RUNNER_TEMP/bad12.out" 2>&1; then exit 1; fi
          grep -q "REFUSED: $REL: hard link: $F" "$RUNNER_TEMP/bad12.out"
          echo SERVER_PREEXISTING_REFUSALS=OK
          echo SERVER_PACKAGE_CI=PASS

  ops:
    name: stage 6 ops (E6-1..E6-4) local checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: tools (cloud-init schema, sshd, shellcheck)
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloud-init openssh-server > /dev/null
      - name: render user-data with one-time CI keys, cloud-init schema (E6-1, M-S6-02/03/05)
        shell: bash
        run: |
          set -euo pipefail
          ssh-keygen -q -t ed25519 -N '' -C ci-admin -f "$RUNNER_TEMP/ci_admin"
          ssh-keygen -q -t ed25519 -N '' -C ci-deploy -f "$RUNNER_TEMP/ci_deploy"
          ssh-keygen -q -t ed25519 -N '' -C ci-release -f "$RUNNER_TEMP/ci_release"
          python3 -I zavod/ops/server/render_user_data.py --admin-pubkey "$RUNNER_TEMP/ci_admin.pub"             --deploy-pubkey "$RUNNER_TEMP/ci_deploy.pub" --release-signer-pubkey "$RUNNER_TEMP/ci_release.pub" --release-signer-fingerprint "$(ssh-keygen -lf "$RUNNER_TEMP/ci_release.pub" | cut -d' ' -f2)" --repo-id 1412203481             --repo bereznyi-aleksandr/zavod-p1-bot --tenant 48d39de1-2c46-4deb-8557-fec866f2e810 > "$RUNNER_TEMP/user-data.yaml"
          if grep -q 'PRIVATE KEY' "$RUNNER_TEMP/user-data.yaml"; then echo 'private key in user-data'; exit 1; fi
          # M-S6-R5-01: подменённый .pub ключа подписи при отпечатке оператора — отказ, user-data не выводится
          ssh-keygen -q -t ed25519 -N '' -C ci-agent -f "$RUNNER_TEMP/ci_agent"
          if python3 -I zavod/ops/server/render_user_data.py --admin-pubkey "$RUNNER_TEMP/ci_admin.pub" --deploy-pubkey "$RUNNER_TEMP/ci_deploy.pub" --release-signer-pubkey "$RUNNER_TEMP/ci_agent.pub" --release-signer-fingerprint "$(ssh-keygen -lf "$RUNNER_TEMP/ci_release.pub" | cut -d' ' -f2)" --repo-id 1412203481 --repo bereznyi-aleksandr/zavod-p1-bot --tenant 48d39de1-2c46-4deb-8557-fec866f2e810 > "$RUNNER_TEMP/swapped.yaml" 2> "$RUNNER_TEMP/swapped.err"; then echo 'swapped release key accepted'; exit 1; fi
          grep -q 'does not match the operator fingerprint' "$RUNNER_TEMP/swapped.err"
          test ! -s "$RUNNER_TEMP/swapped.yaml"
          echo 'RELEASE_KEY_PIN_CI PASS'
          # M-S6-R7-01: файл совпадает с проверенной сборкой; любая добавка (здесь disable_root false) — отказ
          python3 -I zavod/ops/server/verify_user_data.py "$RUNNER_TEMP/user-data.yaml" | tee "$RUNNER_TEMP/verify.out"
          grep -q '^USERDATA_OK sha256=' "$RUNNER_TEMP/verify.out"
          sed 's/"disable_root": true/"disable_root": false/' "$RUNNER_TEMP/user-data.yaml" > "$RUNNER_TEMP/forged.yaml"
          if python3 -I zavod/ops/server/verify_user_data.py "$RUNNER_TEMP/forged.yaml" > "$RUNNER_TEMP/forged.out"; then echo 'forged user-data accepted'; exit 1; fi
          grep -q '^USERDATA_MISMATCH' "$RUNNER_TEMP/forged.out"
          echo 'USERDATA_PIN_CI PASS'
          cloud-init schema --config-file "$RUNNER_TEMP/user-data.yaml"
      - name: apply the same user-data on the runner through the operator starter (full SHA-256 pin; ufw skipped)
        shell: bash
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/raw"
          mkdir -p "$R/p1" "$R/server"
          cp "$RUNNER_TEMP/user-data.yaml" "$R/p1/user-data.yaml"
          cp zavod/ops/server/apply_user_data.py "$R/server/apply_user_data.py"
          python3 -I zavod/ops/server/render_starter.py --commit "$GITHUB_SHA" --user-data "$R/p1/user-data.yaml" --base "file://$R" --proto =file > "$RUNNER_TEMP/starter.sh"
          cat "$RUNNER_TEMP/starter.sh"
          # M-S6-R8-01: файл, подменённый после проверки, не применяется
          cp "$R/p1/user-data.yaml" "$RUNNER_TEMP/good.yaml"
          printf ' ' >> "$R/p1/user-data.yaml"
          if sudo -E ZAVOD_APPLY_CI_SKIP_FIREWALL=1 sh "$RUNNER_TEMP/starter.sh" > "$RUNNER_TEMP/starter_bad.out" 2>&1; then echo 'tampered user-data applied'; exit 1; fi
          cat "$RUNNER_TEMP/starter_bad.out"
          grep -q 'user-data.yaml: FAILED' "$RUNNER_TEMP/starter_bad.out"
          if id zadmin 2>/dev/null; then echo 'zadmin exists after a refused starter'; exit 1; fi
          cp "$RUNNER_TEMP/good.yaml" "$R/p1/user-data.yaml"
          sudo -E ZAVOD_APPLY_CI_SKIP_FIREWALL=1 sh "$RUNNER_TEMP/starter.sh" | tee "$RUNNER_TEMP/starter.out"
          grep -q '"applied": "apply_user_data v0.2"' "$RUNNER_TEMP/starter.out"
          echo 'STARTER_CI PASS'
          # L-S6-R9-01: disable_root/ssh_pwauth действуют на деле, и программа применения это проверяет
          sudo sshd -T > "$RUNNER_TEMP/sshd_T.out"
          grep -E '^(permitrootlogin|passwordauthentication|kbdinteractiveauthentication|authenticationmethods) ' "$RUNNER_TEMP/sshd_T.out"
          grep -qx 'permitrootlogin no' "$RUNNER_TEMP/sshd_T.out"
          grep -qx 'passwordauthentication no' "$RUNNER_TEMP/sshd_T.out"
          CHECK="import sys; sys.path.insert(0, 'zavod/ops/server'); import apply_user_data as a; a.check_sshd(); print('SSHD_CHECK_OK')"
          sudo python3 -I -c "$CHECK" | grep -qx SSHD_CHECK_OK
          printf 'PermitRootLogin yes\nPasswordAuthentication yes\n' | sudo tee /etc/ssh/sshd_config.d/05-ci-weaker.conf
          if sudo python3 -I -c "$CHECK" > "$RUNNER_TEMP/sshd_bad.out" 2>&1; then echo 'weaker sshd accepted'; exit 1; fi
          cat "$RUNNER_TEMP/sshd_bad.out"
          grep -q 'REFUSED: effective sshd settings' "$RUNNER_TEMP/sshd_bad.out"
          sudo mv /etc/ssh/sshd_config.d/05-ci-weaker.conf "$RUNNER_TEMP/05-ci-weaker.conf.moved"
          sudo python3 -I -c "$CHECK" | grep -qx SSHD_CHECK_OK
          echo 'SSHD_EFFECTIVE_CI PASS'
          sudo sshd -t
          sudo systemctl restart ssh || sudo systemctl restart ssh.socket
      - name: shellcheck and systemd-analyze verify (E6-2, E6-4)
        shell: bash
        run: |
          set -euo pipefail
          shellcheck zavod/ops/server/install_release.sh zavod/ops/deploy_push.sh zavod/ops/ci/e2e_deploy_ci.sh
          test -x /usr/bin/node || sudo ln -s "$(command -v node)" /usr/bin/node
          systemd-analyze verify --man=no zavod/ops/server/zavod-p1.service zavod/ops/server/zavod-p1-watch.service \
            zavod/ops/server/zavod-kernel.service
      - name: real permission schema and deploy as zavod end to end (E6-2, M-S6-02/03, M-S6-R2-01/02)
        shell: bash
        run: |
          set -o pipefail
          bash zavod/ops/ci/e2e_deploy_ci.sh "$RUNNER_TEMP/ci_deploy" "$RUNNER_TEMP/ci_admin" 1412203481             bereznyi-aleksandr/zavod-p1-bot 48d39de1-2c46-4deb-8557-fec866f2e810 "$RUNNER_TEMP/ci_release" | tee "$RUNNER_TEMP/e2e.out"
          test "$(grep -c '^CHECK .* PASS$' "$RUNNER_TEMP/e2e.out")" -eq 15
          grep -q '^E2E_DEPLOY_CI PASS head=' "$RUNNER_TEMP/e2e.out"
      - name: ops unit tests (E6-1..E6-4), no skips
        shell: bash
        env:
          ZAVOD_OPS_SSHD: '1'
        run: |
          set -o pipefail
          command -v pwsh
          python3 -I -m unittest discover -s zavod/ops/tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/ops_tests.out"
          grep -q '^Ran 64 tests' "$RUNNER_TEMP/ops_tests.out"
          grep -q '^OK$' "$RUNNER_TEMP/ops_tests.out"
          node zavod/kernel/ci/leak_scan.mjs zavod/ops
