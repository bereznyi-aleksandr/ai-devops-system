          sudo grep -q '^/usr/share/zavod-ci-trig\( \|$\)' /var/lib/dpkg/triggers/Unincorp
          if cissh "$(opcmd)" > "$RUNNER_TEMP/b_trig2.out" 2>&1; then cat "$RUNNER_TEMP/b_trig2.out"; exit 1; fi
