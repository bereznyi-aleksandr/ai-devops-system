#   Claude, сессия 9951b86f-676a-4a39-84f8-eeef3f226cd1; v0.10: самопроверка приёмки P1 ждёт 3 теста — добавлен тест заглушки v0.2 (399c0823c); v0.9: E5-5 заготовка — журнал инъекций выпуска пилота грузится артефактом прогона; v0.8: этап 5 E5-6 — самопроверка сканера продукта
#   catalog/ci/product_scan.mjs и SR-02 по zavod/catalog без исключений; v0.7.1: слияние v0.6.1 этапа 4 — проверка версии psql без /dev/stderr;
#   v0.7: слияние этапов 4 и 5 — задание jobobject (M-E46-03, PG16 + полный
#   fencer.test.mjs на Job Object) и самопроверка приёмки P1; v0.6 (этап 4): аудит E4-6 M-E46-03;
#   v0.6 (этап 5): самопроверка приёмки P1 (заглушка Bot API, плохой бот обязан не пройти); v0.5: E4-8 — единица «контейнер»: ZAVOD_CONTAINER_IMAGE — тот же
#   закреплённый образ, что у сервера; v0.4: слияние — закрепления L-E35-01 этапа 3 и задание
#   jobobject этапа 4; v0.3 (этап 3): аудит E3-5 L-E35-01 — действия по SHA коммита, образ PostgreSQL по
#   digest, Node точной версией, psql из того же образа; v0.3 (этап 4): задание jobobject на windows-latest —
#   сборка win/zavod_jobhost.exe и тест единицы Job Object; v0.2: аудит Z5 M-Z5-01 — корневая cgroup v2
#   Завода для ограждения единиц исполнения; ZAVOD_CGROUP_ROOT)
# ИСПОЛНИТЕЛЬ: Claude (сессия fd43469f-418c-4f8b-b94b-32cc0b8d4acf)
# НАЗНАЧЕНИЕ: Завод, этап 3 — Kernel на чистом PostgreSQL 16, три независимых прогона
#   (критерий E3-2: три прогона подряд зелёные). Каждый прогон — свой одноразовый контейнер.
# ОГРАНИЧЕНИЯ: секретов не использует; права только на чтение; платных маршрутов нет.
name: Zavod Kernel

on:
  push:
    branches: [main, 'zavod/**']
    paths: ['zavod/**', 'bem954/H1_31_PACKAGE_R51/**', '.github/workflows/zavod-kernel.yml']
  pull_request:
    paths: ['zavod/**', 'bem954/H1_31_PACKAGE_R51/**', '.github/workflows/zavod-kernel.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zavod-kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  PKG: bem954/H1_31_PACKAGE_R51

jobs:
  kernel:
    name: kernel (run ${{ matrix.run }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    services:
      postgres:
        image: postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      ZAVOD_CGROUP_ROOT: /sys/fs/cgroup/zavod
      # Клиент psql/pg_dump/pg_restore/createdb — из того же образа, что и сервер (L-E35-01).
      ZAVOD_PG_IMAGE: postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
      # Единица «контейнер» (E4-8): образ с glibc; node и код Kernel подключаются только на чтение.
      ZAVOD_CONTAINER_IMAGE: postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
      - name: pinned PostgreSQL client (same image digest as the server)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pgbin"
          for t in psql pg_dump pg_restore createdb; do
            printf '#!/usr/bin/env bash\nexec docker run --rm -i --network host -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$PWD" "$ZAVOD_PG_IMAGE" %s "$@"\n' "$t" > "$RUNNER_TEMP/pgbin/$t"
            chmod +x "$RUNNER_TEMP/pgbin/$t"
          done
          echo "$RUNNER_TEMP/pgbin" >> "$GITHUB_PATH"
          PATH="$RUNNER_TEMP/pgbin:$PATH" psql --version | tee /dev/stderr | grep -q 'PostgreSQL) 16\.'
      - name: workflow pins (L-E35-01)
        run: node zavod/kernel/ci/workflow_pins.mjs .github/workflows/zavod-kernel.yml
      - name: cgroup v2 unit root (M-Z5-01)
        run: |
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          sudo mkdir -p "$ZAVOD_CGROUP_ROOT"
          cat "$ZAVOD_CGROUP_ROOT/cgroup.procs" >/dev/null
          command -v setpriv
      - name: Kernel CI (H1.31 install, SR-08, SR-02, tests, SR-09)
        shell: bash
        working-directory: zavod/kernel
        run: |
          set -o pipefail
          bash ci/kernel_ci.sh "$GITHUB_WORKSPACE/$PKG" "$RUNNER_TEMP/kernel" | tee "$RUNNER_TEMP/kernel_transcript.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: zavod-kernel-run-${{ matrix.run }}
          path: |
            ${{ runner.temp }}/kernel_transcript.log
            ${{ runner.temp }}/kernel/tests.out
            ${{ runner.temp }}/kernel/e55_injection_journal.jsonl
            ${{ runner.temp }}/kernel/e55_injection_journal.jsonl.sha256
          if-no-files-found: ignore

  jobobject:
    name: windows job object (PG16 + full fencer)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PGHOST: 127.0.0.1
      PGPORT: '54316'
      PGUSER: postgres
      # M-E46-03: PostgreSQL 16 для Windows — архив EDB; сумма SHA-256 закреплена (та же сборка 16.15-5,
      # что на локальном стенде проекта). Несовпадение суммы — отказ до распаковки.
      ZAVOD_PG_WIN_URL: https://get.enterprisedb.com/postgresql/postgresql-16.15-5-windows-x64-binaries.zip
      ZAVOD_PG_WIN_SHA256: 43bb45f173a6f08cf1d29a97a6d8deb119e8e8093a24c00d2d1001a0ccaa8281
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
      - name: PostgreSQL 16 (pinned EDB binaries, SHA-256), trust only on 127.0.0.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $zip = Join-Path $env:RUNNER_TEMP 'pg16.zip'
          Invoke-WebRequest -Uri $env:ZAVOD_PG_WIN_URL -OutFile $zip
          $h = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($h -ne $env:ZAVOD_PG_WIN_SHA256) { throw "PG16_ZIP_SHA256_MISMATCH got $h" }
          $root = Join-Path $env:RUNNER_TEMP 'pg16'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          tar -xf $zip -C $root
          if ($LASTEXITCODE) { throw 'unpack' }
          $bin = Join-Path $root 'pgsql\bin'
          $data = Join-Path $env:RUNNER_TEMP 'pg16data'
          & "$bin\initdb.exe" -D $data -U postgres -A trust -E UTF8 --locale=C
          if ($LASTEXITCODE) { throw 'initdb' }
          $log = Join-Path $env:RUNNER_TEMP 'pg16.log'
          & "$bin\pg_ctl.exe" -D $data -l $log -o "-p $env:PGPORT -c listen_addresses=127.0.0.1" -w start
          if ($LASTEXITCODE) { Get-Content $log; throw 'pg_ctl start' }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - name: Job Object — full fencer scenario on H1.31 + Z-EXT-01 (M-E46-03, M-Z5-01)
        shell: bash
        working-directory: zavod/kernel
        env:
          CI: 'true'
        run: |
          set -o pipefail
          psql --version
          psql --version | grep -q 'PostgreSQL) 16\.'
          bash ci/windows_fencer_ci.sh "$GITHUB_WORKSPACE/$PKG" "$RUNNER_TEMP/winfencer" | tee "$RUNNER_TEMP/win_fencer_transcript.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: zavod-kernel-windows-jobobject
          path: |
            ${{ runner.temp }}/win_fencer_transcript.log
            ${{ runner.temp }}/winfencer/win_fencer_tests.out
            ${{ runner.temp }}/pg16.log
          if-no-files-found: ignore

  catalog_p1:
    name: catalog P1 acceptance and product scanner selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
      - name: P1 acceptance harness selftest (E5-4)
        shell: bash
        run: |
          set -o pipefail
          node --test zavod/catalog/P1_telegram_bot/acceptance/selftest/selftest.test.mjs | tee "$RUNNER_TEMP/p1_selftest.out"
          grep -q '^# pass 3$' "$RUNNER_TEMP/p1_selftest.out" && grep -q '^# fail 0$' "$RUNNER_TEMP/p1_selftest.out"
      - name: product scanner selftest (E5-6) and SR-02 over zavod/catalog
        shell: bash
        run: |
          set -o pipefail
          node --test zavod/catalog/ci/product_scan.test.mjs | tee "$RUNNER_TEMP/pscan_selftest.out"
          grep -q '^# pass 12$' "$RUNNER_TEMP/pscan_selftest.out" && grep -q '^# fail 0$' "$RUNNER_TEMP/pscan_selftest.out"
          node zavod/kernel/ci/leak_scan.mjs zavod/catalog

  ops:
    name: stage 6 ops (E6-1..E6-4) local checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: tools (cloud-init schema, sshd, shellcheck)
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloud-init openssh-server > /dev/null
      - name: render user-data with one-time CI keys, cloud-init schema (E6-1, M-S6-02/03/05)
        shell: bash
        run: |
          set -euo pipefail
          ssh-keygen -q -t ed25519 -N '' -C ci-admin -f "$RUNNER_TEMP/ci_admin"
          ssh-keygen -q -t ed25519 -N '' -C ci-deploy -f "$RUNNER_TEMP/ci_deploy"
          ssh-keygen -q -t ed25519 -N '' -C ci-release -f "$RUNNER_TEMP/ci_release"
          python3 -I zavod/ops/server/render_user_data.py --admin-pubkey "$RUNNER_TEMP/ci_admin.pub"             --deploy-pubkey "$RUNNER_TEMP/ci_deploy.pub" --release-signer-pubkey "$RUNNER_TEMP/ci_release.pub" --release-signer-fingerprint "$(ssh-keygen -lf "$RUNNER_TEMP/ci_release.pub" | cut -d' ' -f2)" --repo-id 1412203481             --repo bereznyi-aleksandr/zavod-p1-bot --tenant 48d39de1-2c46-4deb-8557-fec866f2e810 > "$RUNNER_TEMP/user-data.yaml"
          if grep -q 'PRIVATE KEY' "$RUNNER_TEMP/user-data.yaml"; then echo 'private key in user-data'; exit 1; fi
          # M-S6-R5-01: подменённый .pub ключа подписи при отпечатке оператора — отказ, user-data не выводится
          ssh-keygen -q -t ed25519 -N '' -C ci-agent -f "$RUNNER_TEMP/ci_agent"
          if python3 -I zavod/ops/server/render_user_data.py --admin-pubkey "$RUNNER_TEMP/ci_admin.pub" --deploy-pubkey "$RUNNER_TEMP/ci_deploy.pub" --release-signer-pubkey "$RUNNER_TEMP/ci_agent.pub" --release-signer-fingerprint "$(ssh-keygen -lf "$RUNNER_TEMP/ci_release.pub" | cut -d' ' -f2)" --repo-id 1412203481 --repo bereznyi-aleksandr/zavod-p1-bot --tenant 48d39de1-2c46-4deb-8557-fec866f2e810 > "$RUNNER_TEMP/swapped.yaml" 2> "$RUNNER_TEMP/swapped.err"; then echo 'swapped release key accepted'; exit 1; fi
          grep -q 'does not match the operator fingerprint' "$RUNNER_TEMP/swapped.err"
          test ! -s "$RUNNER_TEMP/swapped.yaml"
          echo 'RELEASE_KEY_PIN_CI PASS' 
          # M-S6-R7-01: файл совпадает с проверенной сборкой; любая добавка (здесь disable_root false) — отказ
          python3 -I zavod/ops/server/verify_user_data.py "$RUNNER_TEMP/user-data.yaml" | tee "$RUNNER_TEMP/verify.out"
          grep -q '^USERDATA_OK sha256=' "$RUNNER_TEMP/verify.out"
          sed 's/"disable_root": true/"disable_root": false/' "$RUNNER_TEMP/user-data.yaml" > "$RUNNER_TEMP/forged.yaml"
          if python3 -I zavod/ops/server/verify_user_data.py "$RUNNER_TEMP/forged.yaml" > "$RUNNER_TEMP/forged.out"; then echo 'forged user-data accepted'; exit 1; fi
          grep -q '^USERDATA_MISMATCH' "$RUNNER_TEMP/forged.out"
          echo 'USERDATA_PIN_CI PASS'
          cloud-init schema --config-file "$RUNNER_TEMP/user-data.yaml"
      - name: apply the same user-data on the runner through the operator starter (full SHA-256 pin; ufw skipped)
        shell: bash
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/raw"
          mkdir -p "$R/p1" "$R/server"
          cp "$RUNNER_TEMP/user-data.yaml" "$R/p1/user-data.yaml"
          cp zavod/ops/server/apply_user_data.py "$R/server/apply_user_data.py"
          python3 -I zavod/ops/server/render_starter.py --commit "$GITHUB_SHA" --user-data "$R/p1/user-data.yaml" --base "file://$R" --proto =file > "$RUNNER_TEMP/starter.sh"
          cat "$RUNNER_TEMP/starter.sh"
          # M-S6-R8-01: файл, подменённый после проверки, не применяется
          cp "$R/p1/user-data.yaml" "$RUNNER_TEMP/good.yaml"
          printf ' ' >> "$R/p1/user-data.yaml"
          if sudo -E ZAVOD_APPLY_CI_SKIP_FIREWALL=1 sh "$RUNNER_TEMP/starter.sh" > "$RUNNER_TEMP/starter_bad.out" 2>&1; then echo 'tampered user-data applied'; exit 1; fi
          cat "$RUNNER_TEMP/starter_bad.out"
          grep -q 'user-data.yaml: FAILED' "$RUNNER_TEMP/starter_bad.out"
          if id zadmin 2>/dev/null; then echo 'zadmin exists after a refused starter'; exit 1; fi
          cp "$RUNNER_TEMP/good.yaml" "$R/p1/user-data.yaml"
          sudo -E ZAVOD_APPLY_CI_SKIP_FIREWALL=1 sh "$RUNNER_TEMP/starter.sh" | tee "$RUNNER_TEMP/starter.out"
          grep -q '"applied": "apply_user_data v0.2"' "$RUNNER_TEMP/starter.out"
          echo 'STARTER_CI PASS'
          # L-S6-R9-01: disable_root/ssh_pwauth действуют на деле, и программа применения это проверяет
          sudo sshd -T > "$RUNNER_TEMP/sshd_T.out"
          grep -E '^(permitrootlogin|passwordauthentication|kbdinteractiveauthentication|authenticationmethods) ' "$RUNNER_TEMP/sshd_T.out"
          grep -qx 'permitrootlogin no' "$RUNNER_TEMP/sshd_T.out"
          grep -qx 'passwordauthentication no' "$RUNNER_TEMP/sshd_T.out"
          CHECK="import sys; sys.path.insert(0, 'zavod/ops/server'); import apply_user_data as a; a.check_sshd(); print('SSHD_CHECK_OK')"
          sudo python3 -I -c "$CHECK" | grep -qx SSHD_CHECK_OK
          printf 'PermitRootLogin yes\nPasswordAuthentication yes\n' | sudo tee /etc/ssh/sshd_config.d/05-ci-weaker.conf
          if sudo python3 -I -c "$CHECK" > "$RUNNER_TEMP/sshd_bad.out" 2>&1; then echo 'weaker sshd accepted'; exit 1; fi
          cat "$RUNNER_TEMP/sshd_bad.out"
          grep -q 'REFUSED: effective sshd settings' "$RUNNER_TEMP/sshd_bad.out"
          sudo mv /etc/ssh/sshd_config.d/05-ci-weaker.conf "$RUNNER_TEMP/05-ci-weaker.conf.moved"
          sudo python3 -I -c "$CHECK" | grep -qx SSHD_CHECK_OK
          echo 'SSHD_EFFECTIVE_CI PASS'
          sudo sshd -t
          sudo systemctl restart ssh || sudo systemctl restart ssh.socket
      - name: shellcheck and systemd-analyze verify (E6-2, E6-4)
        shell: bash
        run: |
          set -euo pipefail
          shellcheck zavod/ops/server/install_release.sh zavod/ops/deploy_push.sh zavod/ops/ci/e2e_deploy_ci.sh
          systemd-analyze verify --man=no zavod/ops/server/zavod-p1.service zavod/ops/server/zavod-p1-watch.service
      - name: real permission schema and deploy as zavod end to end (E6-2, M-S6-02/03, M-S6-R2-01/02)
        shell: bash
        run: |
          set -o pipefail
          bash zavod/ops/ci/e2e_deploy_ci.sh "$RUNNER_TEMP/ci_deploy" "$RUNNER_TEMP/ci_admin" 1412203481             bereznyi-aleksandr/zavod-p1-bot 48d39de1-2c46-4deb-8557-fec866f2e810 "$RUNNER_TEMP/ci_release" | tee "$RUNNER_TEMP/e2e.out"
          test "$(grep -c '^CHECK .* PASS$' "$RUNNER_TEMP/e2e.out")" -eq 13
          grep -q '^E2E_DEPLOY_CI PASS head=' "$RUNNER_TEMP/e2e.out"
      - name: ops unit tests (E6-1..E6-4), no skips
        shell: bash
        env:
          ZAVOD_OPS_SSHD: '1'
        run: |
          set -o pipefail
          command -v pwsh
          python3 -I -m unittest discover -s zavod/ops/tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/ops_tests.out"
          grep -q '^Ran 56 tests' "$RUNNER_TEMP/ops_tests.out" && grep -q '^OK$' "$RUNNER_TEMP/ops_tests.out"
          node zavod/kernel/ci/leak_scan.mjs zavod/ops
