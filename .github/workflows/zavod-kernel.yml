            done; echo KILL_MISSED ) > "$RUNNER_TEMP/b_kill.out" 2>&1 &
          KP=$!
          if cissh "$(opcmd)" > "$RUNNER_TEMP/b_break.out" 2>&1; then cat "$RUNNER_TEMP/b_break.out"; echo 'break run passed'; exit 1; fi
