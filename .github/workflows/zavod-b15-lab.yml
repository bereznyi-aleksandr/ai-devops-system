# ДОКУМЕНТ: .github/workflows/zavod-b15-lab.yml — лаборатория B15: связь попытки push с записью стены на ubuntu-24.04
# ВЕРСИЯ: v0.2  СТАТУС: DRAFT  ДАТА СОЗДАНИЯ: 2026-11-19 12:42 +02:00  ДАТА ОБНОВЛЕНИЯ: 2026-11-19 12:57 +02:00
# ИСПОЛНИТЕЛЬ: Claude (терминал zavod, пускатель)
# НАЗНАЧЕНИЕ: аудит ChatGPT REL153 L-355-REL153-01 — git 2.43 на Linux (как на сервере) не испытан. Опыт только с немым
#   адресом 192.0.2.10 и поддельным посредником 127.0.0.1; в GitHub ничего не пишется. Плюс офлайн-тесты модулей B15.
name: zavod-b15-lab
on:
  push:
    branches:
      - zavod/stage3-5-b15-*
    paths:
      - zavod/ops/lab_b15/**
      - zavod/ops/server/probes/zprobe_gitlink.py
      - zavod/ops/server/probes/zprobe_sockwatch.py
      - zavod/ops/server/probes/zprobe_start_status.py
      - zavod/ops/server/probes/zprobe_recstore.py
      - zavod/ops/server/probes/test_zprobe_recstore.py
      - .github/workflows/zavod-b15-lab.yml
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: B15 offline module tests
        run: |
          cd zavod/ops/server/probes
          python3 -I -B test_zprobe_gitlink.py
          python3 -I -B test_zprobe_start_status.py
          python3 -I -B test_zprobe_recstore.py
          python3 -I -B test_zprobe_b15_budget.py
      - name: B15 lab on the runner (newest git)
        run: python3 -I -B zavod/ops/lab_b15/lab_b15_gitlink.py
      - name: B15 lab inside ubuntu:24.04 (git 2.43, libcurl 8.5 — as on the server)
        run: |
          docker run --rm --privileged --network host -v "$PWD:/w" -w /w ubuntu:24.04 bash -c '
            set -e
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git python3 iptables sudo openssh-client util-linux procps >/dev/null
            B15_LAB_EXPECT_GIT=2.43. python3 -I -B zavod/ops/lab_b15/lab_b15_gitlink.py'
