# ДОКУМЕНТ: .github/workflows/zavod-b15-lab.yml — лаборатория B15: связь попытки push с записью стены на ubuntu-24.04
# ВЕРСИЯ: v0.1  СТАТУС: DRAFT  ДАТА СОЗДАНИЯ: 2026-11-19 12:42 +02:00  ДАТА ОБНОВЛЕНИЯ: 2026-11-19 12:42 +02:00
# ИСПОЛНИТЕЛЬ: Claude (терминал zavod, пускатель)
# НАЗНАЧЕНИЕ: аудит ChatGPT REL153 L-355-REL153-01 — git 2.43 на Linux (как на сервере) не испытан. Опыт только с немым
#   адресом 192.0.2.10 и поддельным посредником 127.0.0.1; в GitHub ничего не пишется. Плюс офлайн-тесты модулей B15.
name: zavod-b15-lab
on:
  push:
    branches:
      - zavod/stage3-5-b15-*
    paths:
      - zavod/ops/lab_b15/**
      - zavod/ops/server/probes/zprobe_gitlink.py
      - zavod/ops/server/probes/zprobe_sockwatch.py
      - zavod/ops/server/probes/zprobe_start_status.py
      - .github/workflows/zavod-b15-lab.yml
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: B15 offline module tests
        run: |
          cd zavod/ops/server/probes
          python3 -I -B test_zprobe_gitlink.py
          python3 -I -B test_zprobe_start_status.py
          python3 -I -B test_zprobe_b15_budget.py
      - name: B15 lab on real Linux (git push linking)
        run: python3 -I -B zavod/ops/lab_b15/lab_b15_gitlink.py
